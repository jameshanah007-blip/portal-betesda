<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jadwal Kumpulan PW</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f6f8fb;
            color: #263238;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            background: #1f4e79;
            color: white;
        }

        .header-inner {
            width: 100%;
            max-width: 900px;
            margin: auto;
            padding: 18px 20px 24px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 27px;
        }

        .kembali {
            display: inline-flex;
            align-items: center;

            color: white;
            text-decoration: none;

            font-size: 14px;
            font-weight: 600;

            padding: 7px 10px;

            border-radius: 7px;

            transition: background 0.2s ease;
        }

        .kembali:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .kode {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;

            padding: 6px 10px;

            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;

            color: rgba(255, 255, 255, 0.9);
        }

        /* =========================
           JUDUL
        ========================= */

        .judul {
            border-left: 4px solid #ffffff;

            padding-left: 16px;
        }

        .judul-kecil {
            margin: 0 0 7px;

            font-size: 12px;
            font-weight: 700;

            letter-spacing: 1.3px;
            text-transform: uppercase;

            color: rgba(255, 255, 255, 0.72);
        }

        .judul h1 {
            margin: 0;

            font-size: 27px;
            line-height: 1.3;

            font-weight: 700;
        }

        .judul p {
            margin: 6px 0 0;

            font-size: 14px;
            line-height: 1.5;

            color: rgba(255, 255, 255, 0.82);
        }

        /* =========================
           CONTENT
        ========================= */

        .container {
            width: 100%;
            max-width: 900px;
            margin: auto;

            padding: 30px 20px 42px;
        }

        .intro {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 18px;
        }

        .intro h2 {
            margin: 0;

            color: #263f55;

            font-size: 19px;
            font-weight: 700;
        }

        .intro-line {
            height: 1px;
            flex: 1;

            margin-left: 18px;

            background: #dfe5eb;
        }

        /* =========================
           DAFTAR JADWAL
        ========================= */

        .jadwal-list {
            display: grid;

            grid-template-columns: repeat(2, minmax(0, 1fr));

            gap: 15px;
        }

        /* =========================
           KARTU
        ========================= */

        .jadwal-card {
            position: relative;

            background: #ffffff;

            border: 1px solid #e1e7ed;
            border-radius: 12px;

            padding: 18px 19px;

            box-shadow: 0 3px 10px rgba(31, 62, 90, 0.055);

            overflow: hidden;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .jadwal-card:hover {
            transform: translateY(-2px);

            box-shadow: 0 7px 18px rgba(31, 62, 90, 0.09);
        }

        .jadwal-card::after {
            content: "";

            position: absolute;

            top: 0;
            left: 0;
            right: 0;

            height: 3px;

            background: #315d85;
        }

        /* =========================
           TANGGAL
        ========================= */

        .tanggal {
            color: #315d85;

            font-size: 17px;
            font-weight: 700;

            line-height: 1.4;

            padding-bottom: 13px;

            margin-bottom: 13px;

            border-bottom: 1px solid #edf0f3;
        }

        /* =========================
           DETAIL
        ========================= */

        .info,
        .pelayan {
            font-size: 14px;

            line-height: 1.55;

            color: #596672;
        }

        .info {
            margin-bottom: 10px;
        }

        .label {
            color: #374957;
            font-weight: 700;
        }

        /* =========================
           KOSONG
        ========================= */

        .kosong {
            grid-column: 1 / -1;

            background: #ffffff;

            border: 1px solid #e1e7ed;
            border-radius: 12px;

            padding: 34px 20px;

            text-align: center;

            color: #7b8792;

            font-size: 14px;
            line-height: 1.5;

            box-shadow: 0 3px 10px rgba(31, 62, 90, 0.04);
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            padding: 10px 20px 30px;

            text-align: center;

            color: #9aa4ad;
        }

        .footer p {
            margin: 0;

            font-size: 12px;
        }

        /* =========================
           DESKTOP
        ========================= */

        @media (min-width: 768px) {

            .header-inner {
                padding-top: 20px;
                padding-bottom: 26px;
            }

            .judul h1 {
                font-size: 29px;
            }

            .container {
                padding-top: 34px;
            }

            .jadwal-card {
                padding: 19px 21px;
            }

            .tanggal {
                font-size: 18px;
            }

            .info,
            .pelayan {
                font-size: 15px;
            }
        }

        /* =========================
           TABLET
        ========================= */

        @media (max-width: 767px) {

            .jadwal-list {
                grid-template-columns: 1fr;
            }
        }

        /* =========================
           HP
        ========================= */

        @media (max-width: 600px) {

            .header-inner {
                padding: 14px 14px 20px;
            }

            .topbar {
                margin-bottom: 21px;
            }

            .kode {
                font-size: 11px;
                padding: 5px 9px;
            }

            .kembali {
                font-size: 14px;
                padding: 7px 8px;
            }

            .judul {
                padding-left: 12px;
                border-left-width: 3px;
            }

            .judul-kecil {
                font-size: 11px;
                letter-spacing: 1px;

                margin-bottom: 5px;
            }

            .judul h1 {
                font-size: 21px;
                line-height: 1.3;
            }

            .judul p {
                font-size: 13px;
                margin-top: 4px;
            }

            .container {
                padding: 22px 13px 32px;
            }

            .intro {
                margin-bottom: 14px;
            }

            .intro h2 {
                font-size: 17px;
            }

            .intro-line {
                margin-left: 12px;
            }

            .jadwal-list {
                gap: 11px;
            }

            .jadwal-card {
                border-radius: 10px;

                padding: 15px 16px;
            }

            .jadwal-card::after {
                height: 3px;
            }

            .tanggal {
                font-size: 16px;

                padding-bottom: 10px;
                margin-bottom: 10px;
            }

            .info,
            .pelayan {
                font-size: 14px;
                line-height: 1.5;
            }

            .info {
                margin-bottom: 8px;
            }

            .kosong {
                padding: 28px 18px;
            }

            .footer {
                padding-bottom: 24px;
            }
        }

        /* =========================
           HP KECIL
        ========================= */

        @media (max-width: 380px) {

            .kode {
                display: none;
            }

            .judul h1 {
                font-size: 19px;
            }

            .judul p {
                font-size: 12px;
            }

            .container {
                padding-left: 11px;
                padding-right: 11px;
            }

            .jadwal-card {
                padding: 14px 15px;
            }

            .tanggal {
                font-size: 15px;
            }

            .info,
            .pelayan {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header class="header">

        <div class="header-inner">

            <div class="topbar">

                <a href="jadwal-kumpulan.html" class="kembali">
                    ← Kembali
                </a>

                <span class="kode">
                    PW
                </span>

            </div>


            <div class="judul">

                <p class="judul-kecil">
                    PERSEKUTUAN WANITA
                </p>

                <h1>
                    Jadwal Kumpulan PW
                </h1>

                <p>
                    Informasi jadwal kumpulan Persekutuan Wanita
                </p>

            </div>

        </div>

    </header>


    <!-- =========================
         CONTENT
    ========================= -->

    <main class="container">

        <div class="intro">

            <h2>
                Jadwal Mendatang
            </h2>

            <div class="intro-line"></div>

        </div>


        <div id="jadwalList" class="jadwal-list"></div>

    </main>


    <!-- =========================
         FOOTER
    ========================= -->

    <footer class="footer">

        <p>
            Portal Informasi Jemaat
        </p>

    </footer>


    <!-- =========================
         SUPABASE
    ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-client.js"></script>

    <script src="jadwal-pw.js"></script>

</body>

</html>
