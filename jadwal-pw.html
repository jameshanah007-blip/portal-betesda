<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jadwal PW</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .header {
            background: #1f4e79;
            color: white;
            padding: 22px 16px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .header p {
            margin: 6px 0 0;
            font-size: 14px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: auto;
            padding: 20px 14px 30px;
        }

        .kembali {
            display: inline-block;
            margin-bottom: 18px;
            color: #1f4e79;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
        }

        h2 {
            margin: 0 0 8px;
            color: #1f4e79;
            font-size: 22px;
        }

        .deskripsi {
            margin-top: 0;
            margin-bottom: 20px;
            color: #666;
            font-size: 15px;
        }

        .jadwal-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .jadwal-card {
            background: white;
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 2px 7px rgba(0, 0, 0, 0.06);
            border: 1px solid #ddd;
        }

        .tanggal {
            color: #1f4e79;
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 14px;
        }

        .info,
        .pelayan {
            margin-top: 9px;
            font-size: 14px;
            line-height: 1.5;
        }

        .label {
            font-weight: bold;
        }

        .kosong {
            background: white;
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            color: #777;
        }

        .footer {
            margin-top: 20px;
            padding: 20px 15px;
            background: #1f4e79;
            color: white;
            text-align: center;
        }

        .footer p {
            margin: 0;
            font-size: 14px;
        }

        .footer small {
            font-size: 12px;
        }
    </style>
</head>

<body>

    <header class="header">

        <h1>👩 Persekutuan Wanita</h1>

        <p>
            GPIL Jemaat Betesda Purwosari
        </p>

    </header>


    <main class="container">

        <a href="jadwal-kumpulan.html" class="kembali">
            ← Kembali ke Pilihan Kelompok
        </a>

        <h2>Jadwal PW</h2>

        <p class="deskripsi">
            Jadwal Persekutuan Wanita (PW)
        </p>

        <div id="jadwalList" class="jadwal-list"></div>

    </main>


    <footer class="footer">

        <p>
            GPIL Jemaat Betesda Purwosari
        </p>

        <small>
            Portal Informasi Jemaat
        </small>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-client.js"></script>

<script src="jadwal-pw.js"></script>

</body>

</html>
