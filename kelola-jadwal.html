<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#1f4e79"
    >

    <title>
        Kelola Jadwal - GPIL Jemaat Betesda Purwosari
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* ========================================
           RESET
        ======================================== */

        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;

            padding: 16px;

            background:
                #f4f7fa;

            color:
                #1f2937;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            line-height: 1.5;

        }


        /* ========================================
           CONTAINER
        ======================================== */

        .jadwal-container {

            width: 100%;

            max-width:
                1100px;

            margin:
                0 auto;

        }


        /* ========================================
           HEADER
        ======================================== */

        .jadwal-header {

            position: relative;

            padding:
                26px 22px;

            margin-bottom:
                14px;

            background:
                linear-gradient(
                    135deg,
                    #1f4e79,
                    #285f91
                );

            color:
                #ffffff;

            border-radius:
                16px;

            text-align:
                center;

            box-shadow:
                0 6px 18px
                rgba(
                    31,
                    78,
                    121,
                    0.18
                );

        }


        .jadwal-header h1 {

            margin:
                0 0 5px;

            font-size:
                24px;

            font-weight:
                800;

            letter-spacing:
                -0.3px;

        }


        .jadwal-header p {

            margin:
                0;

            font-size:
                14px;

            opacity:
                0.92;

        }


        /* ========================================
           TOMBOL KEMBALI
        ======================================== */

        .btn-kembali {

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            width:
                100%;

            min-height:
                46px;

            margin-bottom:
                16px;

            padding:
                11px 16px;

            background:
                #ffffff;

            color:
                #1f4e79;

            border:
                1px solid #cbd8e5;

            border-radius:
                10px;

            text-decoration:
                none;

            font-size:
                14px;

            font-weight:
                700;

            transition:
                all 0.2s ease;

        }


        .btn-kembali:hover {

            background:
                #1f4e79;

            border-color:
                #1f4e79;

            color:
                #ffffff;

        }


        /* ========================================
           FORM SECTION
        ======================================== */

        .form-section {

            margin-bottom:
                20px;

            padding:
                20px;

            background:
                #ffffff;

            border:
                1px solid #e1e7ed;

            border-radius:
                14px;

            box-shadow:
                0 3px 12px
                rgba(
                    15,
                    23,
                    42,
                    0.05
                );

        }


        .section-heading {

            display:
                flex;

            align-items:
                center;

            gap:
                10px;

            margin-bottom:
                18px;

        }


        .section-heading-line {

            width:
                4px;

            height:
                25px;

            background:
                #1f4e79;

            border-radius:
                4px;

        }


        .section-heading h2 {

            margin:
                0;

            color:
                #1f4e79;

            font-size:
                19px;

            font-weight:
                800;

        }


        .form-grid {

            display:
                grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(0, 1fr)
                );

            gap:
                15px;

        }


        .form-group {

            display:
                flex;

            flex-direction:
                column;

        }


        .form-group.full {

            grid-column:
                1 / -1;

        }


        .form-group label {

            margin-bottom:
                6px;

            color:
                #334155;

            font-size:
                13px;

            font-weight:
                700;

        }


        .form-group input,
        .form-group select {

            width:
                100%;

            min-height:
                46px;

            padding:
                11px 13px;

            background:
                #ffffff;

            color:
                #1f2937;

            border:
                1px solid #cbd5e1;

            border-radius:
                9px;

            outline:
                none;

            font-family:
                inherit;

            font-size:
                14px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;

        }


        .form-group input:focus,
        .form-group select:focus {

            border-color:
                #1f4e79;

            box-shadow:
                0 0 0 3px
                rgba(
                    31,
                    78,
                    121,
                    0.10
                );

        }


        /* ========================================
           FORM BUTTONS
        ======================================== */

        .form-actions {

            display:
                flex;

            gap:
                10px;

            margin-top:
                18px;

        }


        .btn {

            min-height:
                46px;

            padding:
                10px 20px;

            border:
                none;

            border-radius:
                9px;

            font-family:
                inherit;

            font-size:
                14px;

            font-weight:
                700;

            cursor:
                pointer;

            transition:
                all 0.2s ease;

        }


        .btn-simpan {

            background:
                #1f4e79;

            color:
                #ffffff;

            flex:
                1;

        }


        .btn-simpan:hover {

            background:
                #173d61;

        }


        .btn-simpan:disabled {

            opacity:
                0.6;

            cursor:
                not-allowed;

        }


        .btn-batal {

            display:
                none;

            background:
                #eef2f6;

            color:
                #475569;

            border:
                1px solid #d6dee7;

        }


        .btn-batal:hover {

            background:
                #e2e8f0;

        }


        /* ========================================
           DAFTAR JADWAL
        ======================================== */

        .jadwal-section {

            margin-bottom:
                20px;

        }


        .jadwal-section-header {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                12px;

            margin-bottom:
                10px;

        }


        .jadwal-section-title {

            display:
                flex;

            align-items:
                center;

            gap:
                10px;

        }


        .jadwal-section-title .indicator {

            width:
                4px;

            height:
                25px;

            background:
                #1f4e79;

            border-radius:
                4px;

        }


        .jadwal-section-title h2 {

            margin:
                0;

            color:
                #1f4e79;

            font-size:
                18px;

            font-weight:
                800;

        }


        /* ========================================
           TABLE WRAPPER
        ======================================== */

        .table-wrapper {

            width:
                100%;

            overflow-x:
                auto;

            background:
                #ffffff;

            border:
                1px solid #dfe6ed;

            border-radius:
                12px;

            box-shadow:
                0 3px 12px
                rgba(
                    15,
                    23,
                    42,
                    0.05
                );

            -webkit-overflow-scrolling:
                touch;

        }


        /* ========================================
           TABLE
        ======================================== */

        .jadwal-table {

            width:
                100%;

            min-width:
                720px;

            border-collapse:
                collapse;

            font-size:
                13px;

        }


        .jadwal-table thead {

            background:
                #eef4f9;

        }


        .jadwal-table th {

            padding:
                13px 14px;

            color:
                #1f4e79;

            border-bottom:
                1px solid #d8e2eb;

            text-align:
                left;

            font-size:
                12px;

            font-weight:
                800;

            text-transform:
                uppercase;

            letter-spacing:
                0.3px;

            white-space:
                nowrap;

        }


        .jadwal-table td {

            padding:
                13px 14px;

            border-bottom:
                1px solid #edf1f5;

            color:
                #334155;

            vertical-align:
                middle;

        }


        .jadwal-table tbody tr {

            transition:
                background 0.15s ease;

        }


        .jadwal-table tbody tr:hover {

            background:
                #f8fafc;

        }


        .jadwal-table tbody tr:last-child td {

            border-bottom:
                none;

        }


        /* ========================================
           KOLOM
        ======================================== */

        .col-tempat {

            width:
                34%;

            min-width:
                220px;

        }


        .col-tanggal {

            width:
                16%;

            min-width:
                125px;

            white-space:
                nowrap;

        }


        .col-pelayan {

            width:
                32%;

            min-width:
                220px;

        }


        .col-aksi {

            width:
                18%;

            min-width:
                130px;

        }


        /* ========================================
           AKSI
        ======================================== */

        .aksi-wrapper {

            display:
                flex;

            align-items:
                center;

            gap:
                7px;

        }


        .btn-edit,
        .btn-hapus {

            min-height:
                34px;

            padding:
                7px 12px;

            border-radius:
                7px;

            font-family:
                inherit;

            font-size:
                12px;

            font-weight:
                700;

            cursor:
                pointer;

            transition:
                all 0.2s ease;

        }


        .btn-edit {

            background:
                #edf4fa;

            color:
                #1f4e79;

            border:
                1px solid #c9dceb;

        }


        .btn-edit:hover {

            background:
                #1f4e79;

            color:
                #ffffff;

        }


        .btn-hapus {

            background:
                #f8f3f3;

            color:
                #8a4a4a;

            border:
                1px solid #e5d4d4;

        }


        .btn-hapus:hover {

            background:
                #8a4a4a;

            color:
                #ffffff;

        }


        /* ========================================
           EMPTY / LOADING
        ======================================== */

        .empty-row {

            text-align:
                center !important;

            padding:
                25px !important;

            color:
                #64748b !important;

        }


        /* ========================================
           FOOTER
        ======================================== */

        .jadwal-footer {

            padding:
                15px 5px 10px;

            text-align:
                center;

            color:
                #94a3b8;

            font-size:
                12px;

        }


        /* ========================================
           FOCUS
        ======================================== */

        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        a:focus-visible {

            outline:
                3px solid
                rgba(
                    31,
                    78,
                    121,
                    0.20
                );

            outline-offset:
                2px;

        }


        /* ========================================
           TABLET
        ======================================== */

        @media (max-width: 760px) {

            body {

                padding:
                    10px;

            }


            .jadwal-header {

                padding:
                    22px 16px;

                border-radius:
                    13px;

            }


            .jadwal-header h1 {

                font-size:
                    21px;

            }


            .jadwal-header p {

                font-size:
                    13px;

            }


            .form-section {

                padding:
                    16px;

            }


            .form-grid {

                grid-template-columns:
                    1fr;

                gap:
                    13px;

            }


            .form-group.full {

                grid-column:
                    auto;

            }


            .form-actions {

                flex-direction:
                    column;

            }


            .btn {

                width:
                    100%;

            }


            .jadwal-section-title h2 {

                font-size:
                    17px;

            }

        }


        /* ========================================
           HP KECIL
        ======================================== */

        @media (max-width: 480px) {

            .jadwal-container {

                width:
                    100%;

            }


            .jadwal-header {

                margin-bottom:
                    10px;

            }


            .jadwal-header h1 {

                font-size:
                    19px;

            }


            .jadwal-header p {

                font-size:
                    12px;

            }


            .btn-kembali {

                min-height:
                    44px;

                font-size:
                    13px;

            }


            .form-section {

                padding:
                    14px;

                border-radius:
                    11px;

            }


            .section-heading h2 {

                font-size:
                    17px;

            }


            .form-group label {

                font-size:
                    12px;

            }


            .form-group input,
            .form-group select {

                min-height:
                    45px;

                font-size:
                    13px;

            }


            .jadwal-section-title h2 {

                font-size:
                    16px;

            }


            .table-wrapper {

                border-radius:
                    10px;

            }


            .jadwal-table {

                min-width:
                    680px;

            }


            .jadwal-table th {

                padding:
                    11px 12px;

                font-size:
                    11px;

            }


            .jadwal-table td {

                padding:
                    11px 12px;

                font-size:
                    12px;

            }


            .btn-edit,
            .btn-hapus {

                min-height:
                    32px;

                padding:
                    6px 10px;

                font-size:
                    11px;

            }

        }

    </style>

</head>


<body>


<div class="jadwal-container">


    <!-- ======================================
         HEADER
    ======================================= -->

    <header class="jadwal-header">

        <h1>
            Kelola Jadwal
        </h1>

        <p>
            GPIL Jemaat Betesda Purwosari
        </p>

    </header>


    <!-- ======================================
         KEMBALI
    ======================================= -->

    <a
        href="kelola-admin.html"
        class="btn-kembali"
    >
        Kembali ke Admin
    </a>


    <!-- ======================================
         FORM
    ======================================= -->

    <section class="form-section">


        <div class="section-heading">

            <div
                class="section-heading-line"
            ></div>

            <h2>
                Tambah / Edit Jadwal
            </h2>

        </div>


        <form
            onsubmit="simpanJadwal(event)"
        >


            <div class="form-grid">


                <!-- KELOMPOK -->

                <div class="form-group">

                    <label for="kelompok">
                        Kelompok Kumpulan
                    </label>

                    <select
                        id="kelompok"
                        required
                    >

                        <option value="">
                            Pilih kelompok
                        </option>

                        <option value="Rumah Tangga">
                            Rumah Tangga
                        </option>

                        <option value="PKB">
                            PKB
                        </option>

                        <option value="PW">
                            PW
                        </option>

                    </select>

                </div>


                <!-- TANGGAL -->

                <div class="form-group">

                    <label for="tanggal">
                        Tanggal
                    </label>

                    <input
                        type="date"
                        id="tanggal"
                        required
                    >

                </div>


                <!-- TEMPAT -->

                <div class="form-group">

                    <label for="tempat">
                        Tempat Kumpulan
                    </label>

                    <select
                        id="tempat"
                        required
                    >

                        <option value="">
                            Pilih tempat
                        </option>

                    </select>

                </div>


                <!-- PELAYAN FIRMAN -->

                <div class="form-group">

                    <label for="pelayanFirman">
                        Pelayan Firman
                    </label>

                    <select
                        id="pelayanFirman"
                        required
                    >

                        <option value="">
                            Pilih pelayan firman
                        </option>

                    </select>

                </div>


            </div>


            <!-- BUTTON -->

            <div class="form-actions">

                <button
                    type="submit"
                    id="saveButton"
                    class="btn btn-simpan"
                >
                    Simpan Jadwal
                </button>


                <button
                    type="button"
                    id="cancelButton"
                    class="btn btn-batal"
                    onclick="batalEdit()"
                >
                    Batal Edit
                </button>

            </div>


        </form>

    </section>


    <!-- ======================================
         JADWAL RUMAH TANGGA
    ======================================= -->

    <section class="jadwal-section">


        <div class="jadwal-section-header">

            <div class="jadwal-section-title">

                <div
                    class="indicator"
                ></div>

                <h2>
                    Rumah Tangga
                </h2>

            </div>

        </div>


        <div class="table-wrapper">

            <table class="jadwal-table">

                <thead>

                    <tr>

                        <th class="col-tempat">
                            Tempat
                        </th>

                        <th class="col-tanggal">
                            Tanggal
                        </th>

                        <th class="col-pelayan">
                            Pelayan Firman
                        </th>

                        <th class="col-aksi">
                            Aksi
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="jadwalListRumahTangga"
                >
                </tbody>

            </table>

        </div>

    </section>


    <!-- ======================================
         JADWAL PKB
    ======================================= -->

    <section class="jadwal-section">


        <div class="jadwal-section-header">

            <div class="jadwal-section-title">

                <div
                    class="indicator"
                ></div>

                <h2>
                    PKB
                </h2>

            </div>

        </div>


        <div class="table-wrapper">

            <table class="jadwal-table">

                <thead>

                    <tr>

                        <th class="col-tempat">
                            Tempat
                        </th>

                        <th class="col-tanggal">
                            Tanggal
                        </th>

                        <th class="col-pelayan">
                            Pelayan Firman
                        </th>

                        <th class="col-aksi">
                            Aksi
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="jadwalListPKB"
                >
                </tbody>

            </table>

        </div>

    </section>


    <!-- ======================================
         JADWAL PW
    ======================================= -->

    <section class="jadwal-section">


        <div class="jadwal-section-header">

            <div class="jadwal-section-title">

                <div
                    class="indicator"
                ></div>

                <h2>
                    PW
                </h2>

            </div>

        </div>


        <div class="table-wrapper">

            <table class="jadwal-table">

                <thead>

                    <tr>

                        <th class="col-tempat">
                            Tempat
                        </th>

                        <th class="col-tanggal">
                            Tanggal
                        </th>

                        <th class="col-pelayan">
                            Pelayan Firman
                        </th>

                        <th class="col-aksi">
                            Aksi
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="jadwalListPW"
                >
                </tbody>

            </table>

        </div>

    </section>


    <!-- ======================================
         FOOTER
    ======================================= -->

    <footer class="jadwal-footer">

        GPIL Jemaat Betesda Purwosari

    </footer>


</div>


<!-- ========================================
     SUPABASE
========================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-client.js"></script>

<script src="daftar-jadwal.js"></script>

<script src="kelola-jadwal.js"></script>


</body>

</html>
