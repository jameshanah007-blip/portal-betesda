<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kelola Jadwal Kumpulan</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 8px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            color: #1e293b;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* =========================
           TOMBOL KEMBALI
           ========================= */

        .top-bar {
            margin-bottom: 8px;
        }

        .btn-kembali {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 12px;
            border-radius: 7px;
            background: #ffffff;
            color: #334155;
            border: 1px solid #d8dee7;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .btn-kembali:hover {
            background: #f1f5f9;
        }

        /* =========================
           FORM
           ========================= */

        .form-section {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            box-shadow: 0 2px 7px rgba(15, 23, 42, 0.04);
        }

        .form-title {
            margin: 0 0 9px;
            font-size: 16px;
            font-weight: 700;
            color: #1e293b;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 3px;
            font-size: 11px;
            font-weight: 600;
            color: #475569;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            height: 34px;
            padding: 6px 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background: #ffffff;
            color: #334155;
            font-size: 12px;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #64748b;
            box-shadow: 0 0 0 2px rgba(100, 116, 139, 0.10);
        }

        /* =========================
           TOMBOL FORM
           ========================= */

        .form-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
        }

        .btn-simpan,
        .btn-batal {
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .btn-simpan {
            background: #2563eb;
            color: #ffffff;
        }

        .btn-simpan:hover {
            background: #1d4ed8;
        }

        .btn-batal {
            background: #e2e8f0;
            color: #334155;
        }

        .btn-batal:hover {
            background: #cbd5e1;
        }

        /* =========================
           BAGIAN KELOMPOK
           ========================= */

        .jadwal-section {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 9px;
            padding: 8px;
            margin-bottom: 9px;
            box-shadow: 0 2px 7px rgba(15, 23, 42, 0.035);
        }

        .jadwal-section h2 {
            margin: 0 0 6px;
            padding: 0 2px;
            font-size: 14px;
            font-weight: 700;
            color: #1e293b;
        }

        /* =========================
           TABEL
           ========================= */

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 7px;
        }

        table {
            width: 100%;
            min-width: 600px;
            border-collapse: collapse;
            background: #ffffff;
        }

        thead th {
            padding: 7px 8px;
            background: #f1f5f9;
            color: #334155;
            font-size: 11px;
            font-weight: 700;
            text-align: left;
            white-space: nowrap;
            border-bottom: 1px solid #dbe2ea;
        }

        tbody td {
            padding: 5px 8px;
            font-size: 11px;
            line-height: 1.3;
            color: #334155;
            border-bottom: 1px solid #edf0f3;
            vertical-align: middle;
        }

        tbody tr {
            height: 32px;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        /* =========================
           LEBAR KOLOM
           ========================= */

        th:nth-child(1),
        td:nth-child(1) {
            min-width: 210px;
        }

        th:nth-child(2),
        td:nth-child(2) {
            width: 100px;
            white-space: nowrap;
        }

        th:nth-child(3),
        td:nth-child(3) {
            min-width: 190px;
        }

        th:nth-child(4),
        td:nth-child(4) {
            width: 115px;
        }

        /* =========================
           TOMBOL AKSI
           ========================= */

        .aksi {
            display: flex;
            align-items: center;
            gap: 3px;
            white-space: nowrap;
        }

        .btn-edit,
        .btn-hapus {
            border: none;
            border-radius: 5px;
            padding: 4px 6px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .btn-edit {
            background: #e8f1ff;
            color: #2563eb;
        }

        .btn-edit:hover {
            background: #dbeafe;
        }

        .btn-hapus {
            background: #fef0f0;
            color: #dc2626;
        }

        .btn-hapus:hover {
            background: #fee2e2;
        }

        /* =========================
           DATA KOSONG
           ========================= */

        .empty-row {
            text-align: center;
            padding: 9px !important;
            color: #94a3b8;
            font-size: 11px;
        }

        /* =========================
           FOOTER
           ========================= */

        footer {
            text-align: center;
            padding: 8px 0 3px;
            color: #94a3b8;
            font-size: 10px;
        }

        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 700px) {

            body {
                padding: 6px;
            }

            .top-bar {
                margin-bottom: 7px;
            }

            .btn-kembali {
                padding: 6px 10px;
                font-size: 11px;
            }

            .form-section {
                padding: 10px;
                border-radius: 9px;
                margin-bottom: 9px;
            }

            .form-title {
                font-size: 15px;
                margin-bottom: 8px;
            }

            .form-grid {
                grid-template-columns: 1fr 1fr;
                gap: 6px;
            }

            .form-group label {
                font-size: 10px;
                margin-bottom: 3px;
            }

            .form-group input,
            .form-group select {
                height: 33px;
                padding: 5px 7px;
                font-size: 11px;
            }

            .form-actions {
                margin-top: 7px;
                gap: 5px;
            }

            .btn-simpan,
            .btn-batal {
                padding: 6px 10px;
                font-size: 11px;
            }

            .jadwal-section {
                padding: 7px;
                border-radius: 8px;
                margin-bottom: 8px;
            }

            .jadwal-section h2 {
                font-size: 13px;
                margin-bottom: 5px;
            }

            table {
                min-width: 570px;
            }

            thead th {
                padding: 6px 7px;
                font-size: 10px;
            }

            tbody td {
                padding: 4px 7px;
                font-size: 10px;
                line-height: 1.25;
            }

            tbody tr {
                height: 30px;
            }

            .btn-edit,
            .btn-hapus {
                padding: 4px 6px;
                font-size: 9px;
            }

            .aksi {
                gap: 3px;
            }

            footer {
                font-size: 9px;
                padding-top: 6px;
            }
        }

        /* =========================
           HP SANGAT KECIL
           ========================= */

        @media (max-width: 400px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-actions {
                width: 100%;
            }

            .btn-simpan,
            .btn-batal {
                flex: 1;
            }

            table {
                min-width: 550px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- TOMBOL KEMBALI -->
    <div class="top-bar">
        <a href="kelola-admin.html" class="btn-kembali">
            Kembali
        </a>
    </div>


    <!-- FORM JADWAL -->
    <section class="form-section">

        <h1 class="form-title">
            Jadwal Kumpulan
        </h1>

        <div class="form-grid">

            <!-- KELOMPOK -->
            <div class="form-group">
                <label for="kelompok">
                    Kelompok
                </label>

                <select id="kelompok">
                    <option value="">
                        Pilih Kelompok
                    </option>

                    <option value="Rumah Tangga">
                        Rumah Tangga
                    </option>

                    <option value="PKB">
                        PKB
                    </option>

                    <option value="PW">
                        PW
                    </option>
                </select>
            </div>


            <!-- TANGGAL -->
            <div class="form-group">
                <label for="tanggal">
                    Tanggal
                </label>

                <input
                    type="date"
                    id="tanggal"
                >
            </div>


            <!-- TEMPAT -->
            <div class="form-group">
                <label for="tempat">
                    Tempat
                </label>

                <select id="tempat">
                    <option value="">
                        Pilih Tempat
                    </option>
                </select>
            </div>


            <!-- PELAYAN FIRMAN -->
            <div class="form-group">
                <label for="pelayanFirman">
                    Pelayan Firman
                </label>

                <select id="pelayanFirman">
                    <option value="">
                        Pilih Pelayan Firman
                    </option>
                </select>
            </div>

        </div>


        <!-- TOMBOL -->
        <div class="form-actions">

            <button
                type="button"
                id="saveButton"
                class="btn-simpan"
                onclick="simpanJadwal(event)"
            >
                Simpan Jadwal
            </button>

            <button
                type="button"
                id="cancelButton"
                class="btn-batal"
                onclick="batalEdit()"
                style="display: none;"
            >
                Batal Edit
            </button>

        </div>

    </section>


    <!-- =========================
         RUMAH TANGGA
         ========================= -->

    <section class="jadwal-section">

        <h2>
            Rumah Tangga
        </h2>

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>Tempat</th>
                        <th>Tanggal</th>
                        <th>Pelayan Firman</th>
                        <th>Aksi</th>
                    </tr>
                </thead>

                <tbody id="jadwalListRumahTangga">

                    <tr>
                        <td
                            colspan="4"
                            class="empty-row"
                        >
                            Memuat data...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </section>


    <!-- =========================
         PKB
         ========================= -->

    <section class="jadwal-section">

        <h2>
            PKB
        </h2>

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>Tempat</th>
                        <th>Tanggal</th>
                        <th>Pelayan Firman</th>
                        <th>Aksi</th>
                    </tr>
                </thead>

                <tbody id="jadwalListPKB">

                    <tr>
                        <td
                            colspan="4"
                            class="empty-row"
                        >
                            Memuat data...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </section>


    <!-- =========================
         PW
         ========================= -->

    <section class="jadwal-section">

        <h2>
            PW
        </h2>

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>Tempat</th>
                        <th>Tanggal</th>
                        <th>Pelayan Firman</th>
                        <th>Aksi</th>
                    </tr>
                </thead>

                <tbody id="jadwalListPW">

                    <tr>
                        <td
                            colspan="4"
                            class="empty-row"
                        >
                            Memuat data...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </section>


    <!-- FOOTER -->
    <footer>
        GPIL Jemaat Betesda Purwosari
    </footer>

</div>


<!-- =========================
     SCRIPT SUPABASE
     ========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-client.js"></script>

<script src="daftar-jadwal.js"></script>

<script src="kelola-jadwal.js"></script>

</body>
</html>
