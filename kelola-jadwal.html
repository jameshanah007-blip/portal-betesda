<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#1f4e79"
    >

    <title>
        Kelola Jadwal
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* ========================================
           RESET
        ======================================== */

        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;

            padding: 12px;

            background:
                #f4f7fa;

            color:
                #1f2937;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            line-height:
                1.5;

        }


        /* ========================================
           CONTAINER
        ======================================== */

        .jadwal-container {

            width: 100%;

            max-width:
                1200px;

            margin:
                0 auto;

        }


        /* ========================================
           TOMBOL KEMBALI
        ======================================== */

        .btn-kembali {

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            min-height:
                40px;

            margin-bottom:
                14px;

            padding:
                8px 16px;

            background:
                #ffffff;

            color:
                #1f4e79;

            border:
                1px solid #cbd8e5;

            border-radius:
                8px;

            text-decoration:
                none;

            font-size:
                14px;

            font-weight:
                700;

            transition:
                all 0.2s ease;

        }


        .btn-kembali:hover {

            background:
                #1f4e79;

            color:
                #ffffff;

            border-color:
                #1f4e79;

        }


        /* ========================================
           FORM SECTION
        ======================================== */

        .form-section {

            margin-bottom:
                20px;

            padding:
                18px;

            background:
                #ffffff;

            border:
                1px solid #dfe6ed;

            border-radius:
                12px;

            box-shadow:
                0 2px 10px
                rgba(
                    15,
                    23,
                    42,
                    0.04
                );

        }


        .section-heading {

            display:
                flex;

            align-items:
                center;

            gap:
                9px;

            margin-bottom:
                15px;

        }


        .section-heading-line {

            width:
                4px;

            height:
                23px;

            background:
                #1f4e79;

            border-radius:
                4px;

        }


        .section-heading h2 {

            margin:
                0;

            color:
                #1f4e79;

            font-size:
                18px;

            font-weight:
                800;

        }


        /* ========================================
           FORM GRID
        ======================================== */

        .form-grid {

            display:
                grid;

            grid-template-columns:
                repeat(
                    4,
                    minmax(
                        0,
                        1fr
                    )
                );

            gap:
                12px;

        }


        .form-group {

            display:
                flex;

            flex-direction:
                column;

        }


        .form-group label {

            margin-bottom:
                5px;

            color:
                #334155;

            font-size:
                12px;

            font-weight:
                700;

        }


        .form-group input,
        .form-group select {

            width:
                100%;

            min-height:
                43px;

            padding:
                9px 11px;

            background:
                #ffffff;

            color:
                #1f2937;

            border:
                1px solid #cbd5e1;

            border-radius:
                8px;

            outline:
                none;

            font-family:
                inherit;

            font-size:
                13px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;

        }


        .form-group input:focus,
        .form-group select:focus {

            border-color:
                #1f4e79;

            box-shadow:
                0 0 0 3px
                rgba(
                    31,
                    78,
                    121,
                    0.09
                );

        }


        /* ========================================
           BUTTON FORM
        ======================================== */

        .form-actions {

            display:
                flex;

            justify-content:
                flex-end;

            gap:
                8px;

            margin-top:
                13px;

        }


        .btn {

            min-height:
                40px;

            padding:
                8px 18px;

            border-radius:
                8px;

            font-family:
                inherit;

            font-size:
                13px;

            font-weight:
                700;

            cursor:
                pointer;

            transition:
                all 0.2s ease;

        }


        .btn-simpan {

            background:
                #1f4e79;

            color:
                #ffffff;

            border:
                1px solid #1f4e79;

        }


        .btn-simpan:hover {

            background:
                #173d61;

            border-color:
                #173d61;

        }


        .btn-simpan:disabled {

            opacity:
                0.6;

            cursor:
                not-allowed;

        }


        .btn-batal {

            display:
                none;

            background:
                #ffffff;

            color:
                #475569;

            border:
                1px solid #cbd5e1;

        }


        .btn-batal:hover {

            background:
                #f1f5f9;

        }


        /* ========================================
           BAGIAN JADWAL
        ======================================== */

        .jadwal-section {

            margin-bottom:
                18px;

        }


        .jadwal-section-header {

            display:
                flex;

            align-items:
                center;

            margin-bottom:
                8px;

        }


        .jadwal-section-title {

            display:
                flex;

            align-items:
                center;

            gap:
                8px;

        }


        .jadwal-section-title .indicator {

            width:
                4px;

            height:
                22px;

            background:
                #1f4e79;

            border-radius:
                4px;

        }


        .jadwal-section-title h2 {

            margin:
                0;

            color:
                #1f4e79;

            font-size:
                17px;

            font-weight:
                800;

        }


        /* ========================================
           TABLE WRAPPER
        ======================================== */

        .table-wrapper {

            width:
                100%;

            overflow-x:
                auto;

            background:
                #ffffff;

            border:
                1px solid #dfe6ed;

            border-radius:
                10px;

            box-shadow:
                0 2px 9px
                rgba(
                    15,
                    23,
                    42,
                    0.04
                );

            -webkit-overflow-scrolling:
                touch;

        }


        /* ========================================
           TABLE
        ======================================== */

        .jadwal-table {

            width:
                100%;

            min-width:
                650px;

            border-collapse:
                collapse;

            font-size:
                13px;

        }


        .jadwal-table thead {

            background:
                #eef4f9;

        }


        .jadwal-table th {

            padding:
                10px 12px;

            color:
                #1f4e79;

            border-bottom:
                1px solid #d8e2eb;

            text-align:
                left;

            font-size:
                11px;

            font-weight:
                800;

            text-transform:
                uppercase;

            letter-spacing:
                0.3px;

            white-space:
                nowrap;

        }


        .jadwal-table td {

            padding:
                10px 12px;

            color:
                #334155;

            border-bottom:
                1px solid #edf1f5;

            vertical-align:
                middle;

        }


        .jadwal-table tbody tr {

            transition:
                background 0.15s ease;

        }


        .jadwal-table tbody tr:hover {

            background:
                #f8fafc;

        }


        .jadwal-table tbody tr:last-child td {

            border-bottom:
                none;

        }


        /* ========================================
           LEBAR KOLOM
        ======================================== */

        .col-tempat {

            width:
                35%;

            min-width:
                220px;

        }


        .col-tanggal {

            width:
                15%;

            min-width:
                120px;

            white-space:
                nowrap;

        }


        .col-pelayan {

            width:
                32%;

            min-width:
                210px;

        }


        .col-aksi {

            width:
                18%;

            min-width:
                125px;

        }


        /* ========================================
           TOMBOL AKSI
        ======================================== */

        .aksi-wrapper {

            display:
                flex;

            align-items:
                center;

            gap:
                6px;

        }


        .btn-edit,
        .btn-hapus {

            min-height:
                32px;

            padding:
                6px 11px;

            border-radius:
                7px;

            font-family:
                inherit;

            font-size:
                11px;

            font-weight:
                700;

            cursor:
                pointer;

            transition:
                all 0.2s ease;

        }


        .btn-edit {

            background:
                #edf4fa;

            color:
                #1f4e79;

            border:
                1px solid #c9dceb;

        }


        .btn-edit:hover {

            background:
                #1f4e79;

            color:
                #ffffff;

        }


        .btn-hapus {

            background:
                #f8f3f3;

            color:
                #8a4a4a;

            border:
                1px solid #e5d4d4;

        }


        .btn-hapus:hover {

            background:
                #8a4a4a;

            color:
                #ffffff;

        }


        /* ========================================
           DATA KOSONG
        ======================================== */

        .empty-row {

            text-align:
                center !important;

            padding:
                18px !important;

            color:
                #64748b !important;

        }


        /* ========================================
           FOOTER
        ======================================== */

        .jadwal-footer {

            padding:
                8px 5px 5px;

            text-align:
                center;

            color:
                #94a3b8;

            font-size:
                11px;

        }


        /* ========================================
           FOCUS
        ======================================== */

        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        a:focus-visible {

            outline:
                3px solid
                rgba(
                    31,
                    78,
                    121,
                    0.20
                );

            outline-offset:
                2px;

        }


        /* ========================================
           TABLET
        ======================================== */

        @media (max-width: 850px) {

            .form-grid {

                grid-template-columns:
                    repeat(
                        2,
                        minmax(
                            0,
                            1fr
                        )
                    );

            }

        }


        /* ========================================
           HP
        ======================================== */

        @media (max-width: 600px) {

            body {

                padding:
                    8px;

            }


            .btn-kembali {

                width:
                    100%;

                margin-bottom:
                    10px;

            }


            .form-section {

                padding:
                    13px;

                margin-bottom:
                    16px;

                border-radius:
                    10px;

            }


            .section-heading {

                margin-bottom:
                    12px;

            }


            .section-heading h2 {

                font-size:
                    16px;

            }


            .form-grid {

                grid-template-columns:
                    1fr;

                gap:
                    10px;

            }


            .form-group input,
            .form-group select {

                min-height:
                    44px;

            }


            .form-actions {

                flex-direction:
                    column;

            }


            .btn {

                width:
                    100%;

            }


            .jadwal-section {

                margin-bottom:
                    15px;

            }


            .jadwal-section-title h2 {

                font-size:
                    15px;

            }


            .table-wrapper {

                border-radius:
                    8px;

            }


            .jadwal-table {

                min-width:
                    630px;

            }


            .jadwal-table th {

                padding:
                    9px 10px;

                font-size:
                    10px;

            }


            .jadwal-table td {

                padding:
                    9px 10px;

                font-size:
                    12px;

            }


            .btn-edit,
            .btn-hapus {

                min-height:
                    31px;

                padding:
                    5px 9px;

                font-size:
                    10px;

            }

        }


        /* ========================================
           HP SANGAT KECIL
        ======================================== */

        @media (max-width: 380px) {

            body {

                padding:
                    6px;

            }


            .form-section {

                padding:
                    11px;

            }


            .jadwal-table {

                min-width:
                    600px;

            }

        }

    </style>

</head>


<body>


<div class="jadwal-container">


    <!-- ======================================
         KEMBALI
    ======================================= -->

    <a
        href="kelola-admin.html"
        class="btn-kembali"
    >
        Kembali
    </a>


    <!-- ======================================
         FORM KELOLA JADWAL
    ======================================= -->

    <section class="form-section">


        <div class="section-heading">

            <div
                class="section-heading-line"
            ></div>

            <h2>
                Jadwal Kumpulan
            </h2>

        </div>


        <form
            onsubmit="simpanJadwal(event)"
        >


            <div class="form-grid">


                <!-- KELOMPOK -->

                <div class="form-group">

                    <label
                        for="kelompok"
                    >
                        Kelompok
                    </label>

                    <select
                        id="kelompok"
                        required
                    >

                        <option value="">
                            Pilih kelompok
                        </option>

                        <option value="Rumah Tangga">
                            Rumah Tangga
                        </option>

                        <option value="PKB">
                            PKB
                        </option>

                        <option value="PW">
                            PW
                        </option>

                    </select>

                </div>


                <!-- TANGGAL -->

                <div class="form-group">

                    <label
                        for="tanggal"
                    >
                        Tanggal
                    </label>

                    <input
                        type="date"
                        id="tanggal"
                        required
                    >

                </div>


                <!-- TEMPAT -->

                <div class="form-group">

                    <label
                        for="tempat"
                    >
                        Tempat
                    </label>

                    <select
                        id="tempat"
                        required
                    >

                        <option value="">
                            Pilih tempat
                        </option>

                    </select>

                </div>


                <!-- PELAYAN FIRMAN -->

                <div class="form-group">

                    <label
                        for="pelayanFirman"
                    >
                        Pelayan Firman
                    </label>

                    <select
                        id="pelayanFirman"
                        required
                    >

                        <option value="">
                            Pilih pelayan firman
                        </option>

                    </select>

                </div>


            </div>


            <!-- =================================
                 TOMBOL
            ================================== -->

            <div class="form-actions">


                <button
                    type="submit"
                    id="saveButton"
                    class="btn btn-simpan"
                >
                    Simpan Jadwal
                </button>


                <button
                    type="button"
                    id="cancelButton"
                    class="btn btn-batal"
                    onclick="batalEdit()"
                >
                    Batal Edit
                </button>


            </div>


        </form>

    </section>


    <!-- ======================================
         RUMAH TANGGA
    ======================================= -->

    <section class="jadwal-section">


        <div class="jadwal-section-header">

            <div class="jadwal-section-title">

                <div
                    class="indicator"
                ></div>

                <h2>
                    Rumah Tangga
                </h2>

            </div>

        </div>


        <div class="table-wrapper">

            <table class="jadwal-table">


                <thead>

                    <tr>

                        <th
                            class="col-tempat"
                        >
                            Tempat
                        </th>

                        <th
                            class="col-tanggal"
                        >
                            Tanggal
                        </th>

                        <th
                            class="col-pelayan"
                        >
                            Pelayan Firman
                        </th>

                        <th
                            class="col-aksi"
                        >
                            Aksi
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="jadwalListRumahTangga"
                >
                </tbody>


            </table>

        </div>

    </section>


    <!-- ======================================
         PKB
    ======================================= -->

    <section class="jadwal-section">


        <div class="jadwal-section-header">

            <div class="jadwal-section-title">

                <div
                    class="indicator"
                ></div>

                <h2>
                    PKB
                </h2>

            </div>

        </div>


        <div class="table-wrapper">

            <table class="jadwal-table">


                <thead>

                    <tr>

                        <th
                            class="col-tempat"
                        >
                            Tempat
                        </th>

                        <th
                            class="col-tanggal"
                        >
                            Tanggal
                        </th>

                        <th
                            class="col-pelayan"
                        >
                            Pelayan Firman
                        </th>

                        <th
                            class="col-aksi"
                        >
                            Aksi
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="jadwalListPKB"
                >
                </tbody>


            </table>

        </div>

    </section>


    <!-- ======================================
         PW
    ======================================= -->

    <section class="jadwal-section">


        <div class="jadwal-section-header">

            <div class="jadwal-section-title">

                <div
                    class="indicator"
                ></div>

                <h2>
                    PW
                </h2>

            </div>

        </div>


        <div class="table-wrapper">

            <table class="jadwal-table">


                <thead>

                    <tr>

                        <th
                            class="col-tempat"
                        >
                            Tempat
                        </th>

                        <th
                            class="col-tanggal"
                        >
                            Tanggal
                        </th>

                        <th
                            class="col-pelayan"
                        >
                            Pelayan Firman
                        </th>

                        <th
                            class="col-aksi"
                        >
                            Aksi
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="jadwalListPW"
                >
                </tbody>


            </table>

        </div>

    </section>


    <!-- ======================================
         FOOTER
    ======================================= -->

    <footer class="jadwal-footer">

        Kelola Jadwal Kumpulan

    </footer>


</div>


<!-- ========================================
     SCRIPT
========================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-client.js"></script>

<script src="daftar-jadwal.js"></script>

<script src="kelola-jadwal.js"></script>


</body>

</html>
