<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kelola Jadwal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f8fafc;
            color: #1f2937;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* =========================
           HEADER
        ========================= */

        .page-header {
            margin-bottom: 20px;
        }

        .page-header h1 {
            margin: 0 0 5px;
            font-size: 24px;
            color: #111827;
        }

        .page-header p {
            margin: 0;
            font-size: 14px;
            color: #6b7280;
        }

        /* =========================
           FORM
        ========================= */

        .form-box {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
        }

        .form-title {
            margin: 0 0 15px;
            font-size: 17px;
            font-weight: 700;
            color: #111827;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            height: 40px;
            padding: 8px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: #ffffff;
            color: #111827;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.1);
        }

        /* =========================
           TOMBOL FORM
        ========================= */

        .form-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .btn-simpan,
        .btn-batal {
            border: none;
            border-radius: 6px;
            min-height: 40px;
            padding: 9px 16px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-simpan {
            background: #2563eb;
            color: white;
        }

        .btn-simpan:hover {
            background: #1d4ed8;
        }

        .btn-batal {
            background: #e5e7eb;
            color: #374151;
        }

        .btn-batal:hover {
            background: #d1d5db;
        }

        .btn-simpan:disabled,
        .btn-batal:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* =========================
           DAFTAR JADWAL
        ========================= */

        .list-box {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
        }

        .list-title {
            margin: 0;
            font-size: 17px;
            font-weight: 700;
            color: #111827;
        }

        .jadwal-group-title {
            margin: 20px 0 8px;
            padding-bottom: 7px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
            font-weight: 700;
            color: #374151;
        }

        .jadwal-group-title:first-child {
            margin-top: 15px;
        }

        /* =========================
           TABLE
        ========================= */

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .jadwal-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            background: #ffffff;
        }

        .jadwal-table th {
            padding: 8px 10px;
            background: #f3f4f6;
            border-bottom: 2px solid #d1d5db;
            color: #374151;
            font-size: 12px;
            font-weight: 700;
            text-align: left;
            white-space: nowrap;
        }

        .jadwal-table td {
            padding: 8px 10px;
            border-bottom: 1px solid #e5e7eb;
            color: #374151;
            vertical-align: middle;
        }

        .jadwal-table tbody tr:hover {
            background: #f9fafb;
        }

        .jadwal-table td:first-child {
            font-weight: 600;
            color: #111827;
        }

        .jadwal-table td:nth-child(2) {
            white-space: nowrap;
        }

        .jadwal-table th:last-child,
        .jadwal-table td:last-child {
            width: 1%;
            white-space: nowrap;
            text-align: center;
        }

        /* =========================
           TOMBOL AKSI
        ========================= */

        .btn-edit-jadwal,
        .btn-hapus-jadwal {
            border: none;
            border-radius: 5px;
            padding: 5px 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-edit-jadwal {
            background: #eef2ff;
            color: #4338ca;
        }

        .btn-edit-jadwal:hover {
            background: #e0e7ff;
        }

        .btn-hapus-jadwal {
            background: #fef2f2;
            color: #dc2626;
            margin-left: 3px;
        }

        .btn-hapus-jadwal:hover {
            background: #fee2e2;
        }

        /* =========================
           EMPTY STATE
        ========================= */

        .empty-data {
            padding: 25px 10px;
            text-align: center;
            color: #6b7280;
            font-size: 13px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            body {
                padding: 12px;
            }

            .page-header h1 {
                font-size: 20px;
            }

            .page-header p {
                font-size: 13px;
            }

            .form-box,
            .list-box {
                padding: 12px;
                border-radius: 8px;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 11px;
            }

            .form-group input,
            .form-group select {
                height: 38px;
                font-size: 13px;
            }

            .form-actions {
                margin-top: 13px;
            }

            .btn-simpan,
            .btn-batal {
                flex: 1;
                padding: 8px 10px;
                font-size: 12px;
            }

            .jadwal-table {
                min-width: 620px;
                font-size: 12px;
            }

            .jadwal-table th {
                padding: 7px 8px;
                font-size: 11px;
            }

            .jadwal-table td {
                padding: 7px 8px;
            }

            .btn-edit-jadwal,
            .btn-hapus-jadwal {
                padding: 4px 6px;
                font-size: 10px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="page-header">
        <h1>Kelola Jadwal</h1>
        <p>Tambah, ubah, dan hapus jadwal pelayanan.</p>
    </div>

    <!-- FORM -->
    <div class="form-box">

        <h2 class="form-title">Form Jadwal</h2>

        <div class="form-grid">

            <!-- KELOMPOK -->
            <div class="form-group">
                <label for="kelompok">Kelompok</label>

                <select id="kelompok">
                    <option value="">-- Pilih Kelompok --</option>
                    <option value="Rumah Tangga">Rumah Tangga</option>
                    <option value="PKB">PKB</option>
                    <option value="PW">PW</option>
                </select>
            </div>

            <!-- TANGGAL -->
            <div class="form-group">
                <label for="tanggal">Tanggal</label>

                <input
                    type="text"
                    id="tanggal"
                    placeholder="DD/MM/YYYY"
                    maxlength="10"
                    inputmode="numeric"
                    autocomplete="off"
                >
            </div>

            <!-- TEMPAT -->
            <div class="form-group">
                <label for="tempat">Tempat</label>

                <select id="tempat">
                    <option value="">-- Pilih Tempat --</option>
                </select>
            </div>

            <!-- PELAYAN FIRMAN -->
            <div class="form-group">
                <label for="pelayanFirman">Pelayan Firman</label>

                <select id="pelayanFirman">
                    <option value="">-- Pilih Pelayan Firman --</option>
                </select>
            </div>

        </div>

        <!-- TOMBOL -->
        <div class="form-actions">

            <button
                type="button"
                class="btn-simpan"
                id="saveButton"
                onclick="simpanJadwal()"
            >
                💾 Simpan Jadwal
            </button>

            <button
                type="button"
                class="btn-batal"
                id="cancelButton"
                onclick="batalEdit()"
                style="display: none;"
            >
                ❌ Batal Edit
            </button>

        </div>

    </div>

    <!-- DAFTAR -->
    <div class="list-box">

        <h2 class="list-title">Daftar Jadwal</h2>

        <div id="jadwalList">
            <div class="empty-data">
                Memuat data jadwal...
            </div>
        </div>

    </div>

</div>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-client.js"></script>
<script src="daftar-jadwal.js"></script>
<script src="kelola-jadwal.js"></script>

</body>
</html>
