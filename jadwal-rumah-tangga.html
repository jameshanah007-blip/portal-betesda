<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jadwal Kumpulan Rumah Tangga</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            color: #263238;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            background: #1f4e79;
            color: white;
            padding: 18px 20px 22px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.10);
        }

        .header-inner {
            width: 100%;
            max-width: 760px;
            margin: auto;
        }

        .kembali {
            display: inline-flex;
            align-items: center;
            min-height: 38px;
            padding: 7px 12px;
            border-radius: 8px;

            color: white;
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.20);

            text-decoration: none;
            font-size: 14px;
            font-weight: 600;

            margin-bottom: 17px;
            transition: background 0.2s ease;
        }

        .kembali:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        .kembali:active {
            transform: scale(0.98);
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            line-height: 1.3;
            font-weight: 700;
            letter-spacing: -0.2px;
        }

        /* =========================
           CONTENT
        ========================= */

        .container {
            width: 100%;
            max-width: 760px;
            margin: auto;
            padding: 22px 16px 35px;
        }

        .jadwal-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* =========================
           KARTU JADWAL
        ========================= */

        .jadwal-card {
            position: relative;

            background: #ffffff;
            border: 1px solid #e1e6eb;
            border-radius: 12px;

            padding: 16px 18px 16px 20px;

            box-shadow: 0 2px 7px rgba(31, 78, 121, 0.07);

            overflow: hidden;
        }

        .jadwal-card::before {
            content: "";

            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;

            width: 4px;

            background: #1f4e79;
        }

        .tanggal {
            color: #1f4e79;

            font-size: 17px;
            line-height: 1.4;

            font-weight: 700;

            margin-bottom: 10px;
        }

        .info,
        .pelayan {
            font-size: 15px;
            line-height: 1.5;

            color: #59636e;
        }

        .info {
            margin-bottom: 8px;
        }

        .pelayan {
            padding-top: 8px;
            border-top: 1px solid #edf0f3;
        }

        .label {
            color: #374151;
            font-weight: 600;
        }

        /* =========================
           JIKA BELUM ADA JADWAL
        ========================= */

        .kosong {
            background: white;

            border: 1px solid #e1e6eb;
            border-radius: 12px;

            padding: 28px 18px;

            text-align: center;

            color: #697586;

            font-size: 15px;
            line-height: 1.5;

            box-shadow: 0 2px 7px rgba(31, 78, 121, 0.05);
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            padding: 8px 15px 28px;

            text-align: center;

            color: #8a949e;
        }

        .footer p {
            margin: 0;

            font-size: 13px;
            font-weight: 600;
        }

        /* =========================
           DESKTOP
        ========================= */

        @media (min-width: 768px) {

            .header {
                padding: 20px 24px 23px;
            }

            .kembali {
                margin-bottom: 18px;
            }

            .header h1 {
                font-size: 26px;
            }

            .container {
                padding-top: 26px;
            }

            .jadwal-card {
                padding: 17px 20px 17px 22px;
            }

            .tanggal {
                font-size: 18px;
            }

            .info,
            .pelayan {
                font-size: 15px;
            }
        }

        /* =========================
           HP
        ========================= */

        @media (max-width: 480px) {

            .header {
                padding: 15px 15px 19px;
            }

            .kembali {
                min-height: 36px;
                padding: 6px 11px;

                font-size: 14px;

                margin-bottom: 14px;
            }

            .header h1 {
                font-size: 21px;
                line-height: 1.3;
            }

            .container {
                padding: 18px 12px 28px;
            }

            .jadwal-list {
                gap: 10px;
            }

            .jadwal-card {
                border-radius: 10px;

                padding: 14px 14px 14px 17px;
            }

            .jadwal-card::before {
                width: 3px;
            }

            .tanggal {
                font-size: 16px;
                margin-bottom: 8px;
            }

            .info,
            .pelayan {
                font-size: 14px;
                line-height: 1.5;
            }

            .info {
                margin-bottom: 7px;
            }

            .pelayan {
                padding-top: 7px;
            }

            .footer {
                padding-bottom: 24px;
            }

            .footer p {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="header-inner">

            <a href="jadwal-kumpulan.html" class="kembali">
                ← Kembali
            </a>

            <h1>
                Jadwal Kumpulan Rumah Tangga
            </h1>

        </div>
    </header>


    <main class="container">

        <div id="jadwalList" class="jadwal-list"></div>

    </main>


    <footer class="footer">
        <p>
            Portal Informasi Jemaat
        </p>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="jadwal-rumah-tangga.js"></script>

</body>

</html>
