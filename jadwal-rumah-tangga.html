<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jadwal Kumpulan Rumah Tangga</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f6fa;
            color: #1f2937;
        }


        /* =================================
           HEADER
        ================================= */

        .header {
            background: linear-gradient(
                145deg,
                #173f63 0%,
                #1f4e79 55%,
                #2d6797 100%
            );

            color: white;

            padding: 22px 18px 30px;

            border-radius: 0 0 28px 28px;

            box-shadow:
                0 6px 18px rgba(20, 55, 85, 0.18);
        }

        .header-inner {
            width: 100%;
            max-width: 600px;
            margin: auto;
        }


        /* =================================
           TOMBOL KEMBALI
        ================================= */

        .kembali {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-height: 42px;

            padding: 8px 14px;

            border-radius: 12px;

            color: white;

            background: rgba(255, 255, 255, 0.13);

            border: 1px solid rgba(255, 255, 255, 0.18);

            text-decoration: none;

            font-size: 16px;
            font-weight: 700;

            margin-bottom: 27px;

            transition: 0.2s ease;
        }

        .kembali:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.2);
        }


        /* =================================
           JUDUL HEADER
        ================================= */

        .judul-kecil {
            margin: 0 0 8px;

            font-size: 14px;

            font-weight: 700;

            letter-spacing: 1.2px;

            text-transform: uppercase;

            color: rgba(255, 255, 255, 0.75);
        }

        .header h1 {
            margin: 0;

            font-size: 29px;

            line-height: 1.25;

            font-weight: 800;

            letter-spacing: -0.4px;
        }

        .header-deskripsi {
            margin: 10px 0 0;

            font-size: 16px;

            line-height: 1.5;

            color: rgba(255, 255, 255, 0.88);
        }


        /* =================================
           CONTENT
        ================================= */

        .container {
            width: 100%;
            max-width: 600px;

            margin: auto;

            padding: 24px 14px 35px;
        }


        /* =================================
           DAFTAR JADWAL
        ================================= */

        .jadwal-list {
            display: flex;

            flex-direction: column;

            gap: 16px;
        }


        /* =================================
           CARD
        ================================= */

        .jadwal-card {
            position: relative;

            background: #ffffff;

            border-radius: 18px;

            padding: 21px 19px 20px 22px;

            border: 1px solid #e4eaf0;

            box-shadow:
                0 4px 14px rgba(31, 78, 121, 0.09);

            overflow: hidden;
        }

        .jadwal-card::before {
            content: "";

            position: absolute;

            left: 0;
            top: 0;
            bottom: 0;

            width: 6px;

            background: #1f4e79;
        }


        /* =================================
           TANGGAL
        ================================= */

        .tanggal {
            color: #173f63;

            font-size: 20px;

            line-height: 1.4;

            font-weight: 800;

            margin-bottom: 17px;
        }


        /* =================================
           INFORMASI
        ================================= */

        .info,
        .pelayan {
            font-size: 17px;

            line-height: 1.6;

            color: #4b5563;
        }

        .info {
            margin-bottom: 13px;
        }

        .pelayan {
            padding-top: 13px;

            border-top: 1px solid #e8edf2;
        }

        .label {
            color: #27384a;

            font-weight: 800;
        }


        /* =================================
           JIKA TIDAK ADA DATA
        ================================= */

        .kosong {
            background: white;

            border-radius: 18px;

            padding: 34px 20px;

            text-align: center;

            color: #687585;

            border: 1px solid #e4eaf0;

            box-shadow:
                0 4px 14px rgba(31, 78, 121, 0.07);

            font-size: 16px;

            line-height: 1.5;
        }


        /* =================================
           FOOTER
        ================================= */

        .footer {
            padding: 10px 15px 30px;

            text-align: center;

            color: #7a8795;
        }

        .footer p {
            margin: 0;

            font-size: 14px;

            font-weight: 700;
        }

        .footer small {
            display: block;

            margin-top: 6px;

            font-size: 12px;
        }


        /* =================================
           KHUSUS LAYAR HP
        ================================= */

        @media (max-width: 480px) {

            .header {
                padding: 20px 17px 29px;

                border-radius: 0 0 25px 25px;
            }

            .kembali {
                font-size: 16px;

                min-height: 44px;

                padding: 8px 15px;

                margin-bottom: 25px;
            }

            .judul-kecil {
                font-size: 13px;

                letter-spacing: 1px;
            }

            .header h1 {
                font-size: 27px;

                line-height: 1.28;
            }

            .header-deskripsi {
                font-size: 16px;

                margin-top: 9px;
            }

            .container {
                padding: 21px 12px 32px;
            }

            .jadwal-list {
                gap: 15px;
            }

            .jadwal-card {
                padding: 20px 17px 20px 21px;

                border-radius: 17px;
            }

            .tanggal {
                font-size: 20px;

                line-height: 1.4;

                margin-bottom: 16px;
            }

            .info,
            .pelayan {
                font-size: 17px;

                line-height: 1.65;
            }

            .pelayan {
                padding-top: 14px;
            }
        }
    </style>
</head>


<body>


    <!-- =================================
         HEADER
    ================================= -->

    <header class="header">

        <div class="header-inner">

            <a
                href="jadwal-kumpulan.html"
                class="kembali"
            >
                ← Kembali
            </a>


            <p class="judul-kecil">
                JADWAL KUMPULAN
            </p>


            <h1>
                Rumah Tangga
            </h1>


            <p class="header-deskripsi">
                GPIL Jemaat Betesda Purwosari
            </p>

        </div>

    </header>


    <!-- =================================
         CONTENT
    ================================= -->

    <main class="container">

        <div
            id="jadwalList"
            class="jadwal-list"
        ></div>

    </main>


    <!-- =================================
         FOOTER
    ================================= -->

    <footer class="footer">

        <p>
            GPIL Jemaat Betesda Purwosari
        </p>

        <small>
            Portal Informasi Jemaat
        </small>

    </footer>


    <!-- =================================
         SUPABASE
    ================================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-client.js"></script>

    <script src="jadwal-rumah-tangga.js"></script>

</body>

</html>
