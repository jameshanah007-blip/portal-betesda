<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jadwal Rumah Tangga</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .header {
            background: #1f4e79;
            color: white;
            padding: 22px 16px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 23px;
        }

        .header p {
            margin: 6px 0 0;
            font-size: 14px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: auto;
            padding: 20px 14px 30px;
        }

        .kembali {
            display: inline-block;
            margin-bottom: 18px;
            color: #1f4e79;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
        }

        h2 {
            margin: 0 0 5px;
            color: #1f4e79;
            font-size: 22px;
        }

        .deskripsi {
            margin: 0 0 20px;
            color: #666;
            font-size: 14px;
        }

        .jadwal-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .jadwal-card {
            background: white;
            border-radius: 14px;
            padding: 18px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.07);

            border-left: 5px solid #1f4e79;
        }

        .tanggal {
            color: #1f4e79;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .info {
            margin: 9px 0;
            font-size: 15px;
        }

        .label {
            font-weight: bold;
        }

        .pelayan {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #eee;

            font-size: 15px;
        }

        .kosong {
            background: white;
            border-radius: 14px;
            padding: 25px 18px;
            text-align: center;
            color: #777;
        }

        .footer {
            margin-top: 20px;
            padding: 20px 15px;
            background: #1f4e79;
            color: white;
            text-align: center;
        }

        .footer p {
            margin: 0;
            font-size: 14px;
        }

        .footer small {
            font-size: 12px;
        }
    </style>
</head>

<body>

    <header class="header">

        <h1>🏠 Rumah Tangga</h1>

        <p>
            Jadwal Kumpulan
        </p>

    </header>


    <main class="container">

        <a href="jadwal-kumpulan.html" class="kembali">
            ← Kembali ke Pilihan Kelompok
        </a>


        <h2>Jadwal Rumah Tangga</h2>

        <p class="deskripsi">
            Jadwal kumpulan Rumah Tangga GPIL Jemaat Betesda Purwosari.
        </p>


        <div id="jadwalList" class="jadwal-list">
        </div>

    </main>


    <footer class="footer">

        <p>
            GPIL Jemaat Betesda Purwosari
        </p>

        <small>
            Portal Informasi Jemaat
        </small>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-client.js"></script>

<script src="jadwal-rumah-tangga.js"></script>

</body>

</html>
