<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jadwal Kumpulan Rumah Tangga</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            background: linear-gradient(
                135deg,
                #1f4e79,
                #286090
            );

            color: white;
            padding: 28px 20px 32px;

            border-radius: 0 0 24px 24px;

            box-shadow:
                0 4px 14px rgba(0, 0, 0, 0.12);
        }

        .header-inner {
            max-width: 600px;
            margin: auto;
        }

        .kembali {
            display: inline-flex;
            align-items: center;
            gap: 6px;

            color: white;
            text-decoration: none;

            font-size: 14px;
            font-weight: 600;

            margin-bottom: 24px;

            opacity: 0.95;
        }

        .kembali:active {
            opacity: 0.7;
        }

        .header h1 {
            margin: 0;

            font-size: 25px;
            line-height: 1.3;

            font-weight: 700;
        }

        .header p {
            margin: 7px 0 0;

            font-size: 14px;

            opacity: 0.85;
        }


        /* =========================
           CONTENT
        ========================= */

        .container {
            width: 100%;
            max-width: 600px;

            margin: auto;

            padding: 22px 14px 35px;
        }


        /* =========================
           JADWAL LIST
        ========================= */

        .jadwal-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }


        /* =========================
           CARD JADWAL
        ========================= */

        .jadwal-card {
            position: relative;

            background: white;

            border-radius: 16px;

            padding: 18px;

            box-shadow:
                0 3px 12px rgba(31, 78, 121, 0.08);

            border: 1px solid #e8edf3;

            overflow: hidden;
        }

        .jadwal-card::before {
            content: "";

            position: absolute;

            left: 0;
            top: 0;
            bottom: 0;

            width: 5px;

            background: #1f4e79;
        }


        /* =========================
           TANGGAL
        ========================= */

        .tanggal {
            color: #1f4e79;

            font-size: 17px;

            font-weight: 700;

            margin-bottom: 14px;

            padding-left: 2px;
        }


        /* =========================
           INFORMASI
        ========================= */

        .info,
        .pelayan {
            font-size: 14px;

            line-height: 1.6;

            color: #4b5563;
        }

        .info {
            margin-bottom: 11px;
        }

        .pelayan {
            padding-top: 11px;

            border-top: 1px solid #edf0f3;
        }

        .label {
            color: #374151;
            font-weight: 700;
        }


        /* =========================
           JIKA KOSONG
        ========================= */

        .kosong {
            background: white;

            border-radius: 16px;

            padding: 30px 20px;

            text-align: center;

            color: #6b7280;

            border: 1px solid #e8edf3;

            box-shadow:
                0 3px 12px rgba(31, 78, 121, 0.06);

            font-size: 14px;
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {
            padding: 22px 15px 28px;

            text-align: center;

            color: #8a94a3;
        }

        .footer p {
            margin: 0;

            font-size: 13px;

            font-weight: 600;
        }

        .footer small {
            display: block;

            margin-top: 5px;

            font-size: 11px;
        }


        /* =========================
           RESPONSIVE HP
        ========================= */

        @media (max-width: 480px) {

            .header {
                padding: 24px 18px 28px;

                border-radius: 0 0 20px 20px;
            }

            .header h1 {
                font-size: 23px;
            }

            .container {
                padding: 18px 12px 30px;
            }

            .jadwal-card {
                padding: 17px;
                border-radius: 15px;
            }

            .tanggal {
                font-size: 16px;
            }

            .info,
            .pelayan {
                font-size: 14px;
            }
        }
    </style>
</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <div class="header-inner">

            <a
                href="jadwal-kumpulan.html"
                class="kembali"
            >
                ← Kembali
            </a>

            <h1>
                Jadwal Kumpulan Rumah Tangga
            </h1>

            <p>
                GPIL Jemaat Betesda Purwosari
            </p>

        </div>

    </header>


    <!-- =========================
         CONTENT
    ========================== -->

    <main class="container">

        <div
            id="jadwalList"
            class="jadwal-list"
        ></div>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="footer">

        <p>
            GPIL Jemaat Betesda Purwosari
        </p>

        <small>
            Portal Informasi Jemaat
        </small>

    </footer>


    <!-- =========================
         SUPABASE
    ========================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-client.js"></script>

    <script src="jadwal-rumah-tangga.js"></script>


</body>

</html>
