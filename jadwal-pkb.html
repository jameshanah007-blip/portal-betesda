<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jadwal Kumpulan PKB</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f9fc;
            color: #263238;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            background: #ffffff;
            border-bottom: 1px solid #e5e9ef;
        }

        .header-inner {
            width: 100%;
            max-width: 900px;
            margin: auto;
            padding: 16px 20px 20px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 25px;
        }

        .kembali {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            color: #315d85;
            text-decoration: none;

            font-size: 14px;
            font-weight: 600;

            padding: 8px 11px;
            border-radius: 8px;

            transition: 0.2s ease;
        }

        .kembali:hover {
            background: #f0f4f8;
        }

        .kembali:active {
            transform: scale(0.98);
        }

        .badge {
            display: inline-flex;
            align-items: center;

            padding: 6px 10px;

            border-radius: 20px;

            background: #edf4fa;
            color: #315d85;

            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.4px;
        }

        /* =========================
           JUDUL
        ========================= */

        .judul-area {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .ikon {
            width: 52px;
            height: 52px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background: #315d85;
            color: white;

            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;

            box-shadow: 0 5px 12px rgba(49, 93, 133, 0.18);
        }

        .judul-area h1 {
            margin: 0;

            color: #1f3447;

            font-size: 25px;
            line-height: 1.3;

            font-weight: 700;
            letter-spacing: -0.2px;
        }

        .judul-area p {
            margin: 5px 0 0;

            color: #7a8793;

            font-size: 14px;
        }

        /* =========================
           CONTENT
        ========================= */

        .container {
            width: 100%;
            max-width: 900px;
            margin: auto;

            padding: 28px 20px 40px;
        }

        .section-header {
            display: flex;
            align-items: end;
            justify-content: space-between;

            margin-bottom: 18px;
        }

        .section-header h2 {
            margin: 0;

            color: #263f55;

            font-size: 19px;
            font-weight: 700;
        }

        .section-header span {
            color: #8995a0;
            font-size: 13px;
        }

        /* =========================
           TIMELINE
        ========================= */

        .jadwal-list {
            position: relative;

            display: flex;
            flex-direction: column;

            gap: 15px;

            padding-left: 30px;
        }

        .jadwal-list::before {
            content: "";

            position: absolute;

            left: 9px;
            top: 8px;
            bottom: 8px;

            width: 2px;

            background: #dce5ed;
        }

        /* =========================
           KARTU JADWAL
        ========================= */

        .jadwal-card {
            position: relative;

            background: white;

            border: 1px solid #e2e8ee;
            border-radius: 13px;

            padding: 17px 19px;

            box-shadow: 0 3px 10px rgba(30, 60, 90, 0.055);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .jadwal-card:hover {
            transform: translateY(-2px);

            box-shadow: 0 7px 18px rgba(30, 60, 90, 0.09);
        }

        .jadwal-card::before {
            content: "";

            position: absolute;

            width: 11px;
            height: 11px;

            left: -27px;
            top: 23px;

            border-radius: 50%;

            background: #315d85;

            border: 3px solid #f7f9fc;

            box-shadow: 0 0 0 1px #315d85;
        }

        /* =========================
           TANGGAL
        ========================= */

        .tanggal {
            color: #315d85;

            font-size: 17px;
            font-weight: 700;

            line-height: 1.4;

            margin-bottom: 13px;
        }

        /* =========================
           DETAIL
        ========================= */

        .detail {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 14px;

            padding-top: 12px;

            border-top: 1px solid #edf0f3;
        }

        .detail-item {
            min-width: 0;
        }

        .detail-label {
            display: block;

            margin-bottom: 4px;

            color: #8a96a1;

            font-size: 12px;
            font-weight: 600;

            text-transform: uppercase;

            letter-spacing: 0.5px;
        }

        .detail-value {
            color: #3d4d5c;

            font-size: 14px;

            line-height: 1.5;

            font-weight: 600;

            overflow-wrap: anywhere;
        }

        /* =========================
           JIKA BELUM ADA JADWAL
        ========================= */

        .kosong {
            background: white;

            border: 1px solid #e2e8ee;
            border-radius: 13px;

            padding: 35px 20px;

            text-align: center;

            color: #7b8792;

            font-size: 14px;

            line-height: 1.5;

            box-shadow: 0 3px 10px rgba(30, 60, 90, 0.04);
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            text-align: center;

            padding: 8px 20px 30px;

            color: #9aa4ad;
        }

        .footer p {
            margin: 0;

            font-size: 12px;
        }

        /* =========================
           DESKTOP
        ========================= */

        @media (min-width: 768px) {

            .header-inner {
                padding-top: 18px;
                padding-bottom: 23px;
            }

            .container {
                padding-top: 32px;
            }

            .judul-area h1 {
                font-size: 27px;
            }

            .jadwal-card {
                padding: 19px 22px;
            }

            .tanggal {
                font-size: 18px;
            }

            .detail-value {
                font-size: 15px;
            }
        }

        /* =========================
           HP
        ========================= */

        @media (max-width: 600px) {

            .header-inner {
                padding: 13px 14px 18px;
            }

            .topbar {
                margin-bottom: 20px;
            }

            .badge {
                display: none;
            }

            .kembali {
                padding: 7px 9px;
                font-size: 14px;
            }

            .judul-area {
                gap: 12px;
            }

            .ikon {
                width: 45px;
                height: 45px;

                border-radius: 12px;

                font-size: 14px;
            }

            .judul-area h1 {
                font-size: 21px;
            }

            .judul-area p {
                font-size: 13px;
                margin-top: 3px;
            }

            .container {
                padding: 22px 13px 32px;
            }

            .section-header {
                margin-bottom: 15px;
            }

            .section-header h2 {
                font-size: 17px;
            }

            .section-header span {
                font-size: 12px;
            }

            .jadwal-list {
                gap: 12px;
                padding-left: 24px;
            }

            .jadwal-list::before {
                left: 7px;
            }

            .jadwal-card {
                border-radius: 11px;

                padding: 14px 15px;
            }

            .jadwal-card::before {
                width: 9px;
                height: 9px;

                left: -22px;
                top: 20px;

                border-width: 2px;
            }

            .tanggal {
                font-size: 16px;

                margin-bottom: 10px;
            }

            .detail {
                grid-template-columns: 1fr;

                gap: 9px;

                padding-top: 10px;
            }

            .detail-label {
                font-size: 11px;

                margin-bottom: 2px;
            }

            .detail-value {
                font-size: 14px;
            }

            .footer {
                padding-bottom: 22px;
            }
        }

        /* =========================
           HP KECIL
        ========================= */

        @media (max-width: 380px) {

            .judul-area h1 {
                font-size: 19px;
            }

            .ikon {
                width: 42px;
                height: 42px;

                font-size: 13px;
            }

            .container {
                padding-left: 11px;
                padding-right: 11px;
            }

            .jadwal-list {
                padding-left: 22px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         HEADER
    ========================= -->

    <header class="header">

        <div class="header-inner">

            <div class="topbar">

                <a href="jadwal-kumpulan.html" class="kembali">
                    ← Kembali
                </a>

                <span class="badge">
                    PKB
                </span>

            </div>


            <div class="judul-area">

                <div class="ikon">
                    PKB
                </div>

                <div>

                    <h1>
                        Jadwal Kumpulan PKB
                    </h1>

                    <p>
                        Persekutuan Kaum Bapak
                    </p>

                </div>

            </div>

        </div>

    </header>


    <!-- =========================
         CONTENT
    ========================= -->

    <main class="container">

        <div class="section-header">

            <h2>
                Jadwal Mendatang
            </h2>

            <span>
                PKB
            </span>

        </div>


        <div id="jadwalList" class="jadwal-list"></div>

    </main>


    <!-- =========================
         FOOTER
    ========================= -->

    <footer class="footer">

        <p>
            Portal Informasi Jemaat
        </p>

    </footer>


    <!-- =========================
         SUPABASE
    ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-client.js"></script>

    <script src="jadwal-pkb.js"></script>

</body>

</html>
