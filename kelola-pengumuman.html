<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Kelola Pengumuman - GPIL Jemaat Betesda Purwosari
    </title>

    <style>

        * {
            box-sizing: border-box;
        }


        :root {
            --primary: #1f4e79;
            --primary-dark: #163a5c;
            --primary-light: #eef5fb;

            --text: #172033;
            --muted: #64748b;

            --border: #e2e8f0;

            --background: #f5f7fb;

            --white: #ffffff;
        }


        body {
            margin: 0;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: var(--background);

            color: var(--text);

            line-height: 1.5;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            background:
                linear-gradient(
                    135deg,
                    var(--primary-dark),
                    var(--primary)
                );

            color: white;

            text-align: center;

            padding: 27px 18px 28px;

            box-shadow:
                0 4px 18px rgba(15, 23, 42, 0.10);
        }


        header h1 {
            margin: 0;

            font-size: 21px;

            font-weight: 700;

            letter-spacing: -0.3px;
        }


        header p {
            margin: 7px 0 0;

            font-size: 13px;

            opacity: 0.88;
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {
            width: 100%;

            max-width: 620px;

            margin: 0 auto;

            padding: 18px 14px 30px;
        }


        /* =========================
           TOMBOL KEMBALI
        ========================= */

        .btn-kembali {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding: 10px 18px;

            margin-bottom: 16px;

            background: white;

            color: #334155;

            border: 1px solid var(--border);

            border-radius: 12px;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;

            box-shadow:
                0 2px 8px rgba(15, 23, 42, 0.04);

            transition:
                background 0.2s ease,
                color 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                transform 0.2s ease;
        }


        .btn-kembali:hover {
            color: var(--primary);

            background: #f8fafc;

            border-color: #cbd5e1;

            box-shadow:
                0 6px 16px rgba(15, 23, 42, 0.08);
        }


        .btn-kembali:active {
            transform: scale(0.97);
        }


        /* =========================
           CARD
        ========================= */

        .card {
            background: var(--white);

            border: 1px solid #e8edf3;

            border-radius: 18px;

            padding: 22px 18px;

            box-shadow:
                0 8px 28px rgba(15, 23, 42, 0.07);
        }


        /* =========================
           FORM
        ========================= */

        .form-group {
            margin-bottom: 20px;
        }


        label.form-label {
            display: block;

            margin-bottom: 8px;

            color: #334155;

            font-size: 14px;

            font-weight: 600;
        }


        input[type="text"] {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d8e0e8;

            border-radius: 11px;

            background: white;

            color: var(--text);

            font-family: inherit;

            font-size: 15px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }


        input[type="text"]::placeholder {
            color: #94a3b8;
        }


        input[type="text"]:focus {
            border-color: var(--primary);

            box-shadow:
                0 0 0 3px rgba(31, 78, 121, 0.10);
        }


        /* =========================
           FILE PICKER
        ========================= */

        .file-picker {
            position: relative;

            width: 100%;

            min-height: 125px;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 18px;

            border: 1.5px dashed #b8c7d8;

            border-radius: 15px;

            background:
                linear-gradient(
                    180deg,
                    #fbfdff,
                    #f6f9fc
                );

            cursor: pointer;

            overflow: hidden;

            transition:
                border-color 0.2s ease,
                background 0.2s ease,
                transform 0.2s ease;
        }


        .file-picker:hover {
            border-color: var(--primary);

            background: var(--primary-light);
        }


        .file-picker:active {
            transform: scale(0.99);
        }


        /*
         * PENTING:
         * Input file dibuat transparan,
         * tetapi tetap memenuhi seluruh area
         * agar bisa disentuh pada HP.
         */

        .file-picker input[type="file"] {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            margin: 0;

            padding: 0;

            opacity: 0;

            cursor: pointer;

            z-index: 10;
        }


        .file-picker-content {
            position: relative;

            z-index: 1;

            text-align: center;

            pointer-events: none;
        }


        .file-button {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-width: 125px;

            padding: 11px 18px;

            border-radius: 10px;

            background: var(--primary);

            color: white;

            font-size: 14px;

            font-weight: 700;

            box-shadow:
                0 5px 12px rgba(31, 78, 121, 0.18);
        }


        .file-hint {
            margin-top: 9px;

            color: #64748b;

            font-size: 12px;
        }


        /* =========================
           INFO FILE
        ========================= */

        .info-file {
            margin-top: 11px;

            padding: 12px 13px;

            background: #f8fafc;

            border: 1px solid #e5eaf0;

            border-radius: 11px;

            color: #475569;

            font-size: 13px;

            line-height: 1.55;

            display: none;

            word-break: break-word;
        }


        /* =========================
           TOMBOL UPLOAD
        ========================= */

        .btn-upload {
            display: block;

            width: 100%;

            padding: 14px 18px;

            margin-top: 6px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    #28649a
                );

            color: white;

            font-family: inherit;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 7px 17px rgba(31, 78, 121, 0.20);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                opacity 0.2s ease;
        }


        .btn-upload:hover {
            transform: translateY(-1px);

            box-shadow:
                0 10px 22px rgba(31, 78, 121, 0.25);
        }


        .btn-upload:active {
            transform: scale(0.98);
        }


        .btn-upload:disabled {
            background: #94a3b8;

            box-shadow: none;

            cursor: not-allowed;

            opacity: 0.8;

            transform: none;
        }


        /* =========================
           STATUS
        ========================= */

        #status {
            margin-top: 14px;

            padding: 11px 12px;

            border-radius: 10px;

            text-align: center;

            color: #475569;

            font-size: 13px;

            line-height: 1.5;

            word-break: break-word;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            padding: 5px 10px 25px;

            text-align: center;

            color: #94a3b8;

            font-size: 12px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header {
                padding: 23px 15px 24px;
            }


            header h1 {
                font-size: 18px;
            }


            header p {
                font-size: 12px;
            }


            .container {
                padding: 15px 12px 28px;
            }


            .btn-kembali {
                padding: 9px 16px;

                margin-bottom: 14px;

                font-size: 13px;
            }


            .card {
                padding: 20px 15px;

                border-radius: 16px;
            }


            .form-group {
                margin-bottom: 18px;
            }


            label.form-label {
                font-size: 13px;
            }


            input[type="text"] {
                padding: 12px;

                font-size: 14px;
            }


            .file-picker {
                min-height: 120px;
            }


            .file-button {
                min-width: 115px;

                padding: 10px 16px;

                font-size: 13px;
            }


            .file-hint {
                font-size: 11px;
            }


            .btn-upload {
                padding: 13px 16px;

                font-size: 14px;
            }
        }

    </style>
</head>


<body>


<header>

    <h1>
        GPIL Jemaat Betesda Purwosari
    </h1>

    <p>
        Kelola Pengumuman dan Dokumen
    </p>

</header>


<div class="container">


    <!-- Kembali ke menu admin -->

    <a
        href="kelola-admin.html"
        class="btn-kembali"
    >
        Kembali
    </a>


    <div class="card">


        <!-- JUDUL -->

        <div class="form-group">

            <label
                for="judul"
                class="form-label"
            >
                Judul Pengumuman
            </label>


            <input
                type="text"
                id="judul"
                placeholder="Masukkan judul pengumuman"
                autocomplete="off"
            >

        </div>


        <!-- FILE -->

        <div class="form-group">

            <label
                class="form-label"
            >
                Dokumen / File
            </label>


            <label
                class="file-picker"
            >


                <!--
                    Input file tetap aktif
                    untuk HP.
                    Jangan diberi pointer-events:none.
                -->

                <input
                    type="file"
                    id="file"
                    accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.jpg,.jpeg,.png,.gif,.webp,.txt,.csv,.rtf,.odt,.ods,.odp,.zip,.rar,.7z"
                >


                <div
                    class="file-picker-content"
                >

                    <div
                        class="file-button"
                    >
                        Pilih File
                    </div>


                    <div
                        class="file-hint"
                    >
                        Maksimal ukuran 20 MB
                    </div>

                </div>


            </label>


            <div
                id="infoFile"
                class="info-file"
            ></div>


        </div>


        <!-- UPLOAD -->

        <button
            type="button"
            id="btnUpload"
            class="btn-upload"
            onclick="uploadPengumuman()"
        >
            Upload Dokumen
        </button>


        <div id="status"></div>


    </div>


</div>


<footer>
    GPIL Jemaat Betesda Purwosari
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-client.js"></script>

<script src="kelola-pengumuman.js"></script>


</body>
</html>
