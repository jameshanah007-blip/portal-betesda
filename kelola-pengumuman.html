<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Kelola Pengumuman - GPIL Jemaat Betesda Purwosari
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        :root {
            --primary: #1f4e79;
            --primary-dark: #163a5c;
            --primary-light: #eef5fb;

            --text: #172033;
            --muted: #64748b;

            --border: #e2e8f0;

            --background: #f5f7fb;

            --white: #ffffff;

            --danger: #dc2626;
            --danger-light: #fef2f2;

            --edit: #2563eb;
            --edit-light: #eff6ff;
        }


        body {
            margin: 0;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: var(--background);

            color: var(--text);

            line-height: 1.5;
        }


        button,
        input,
        textarea {
            font-family: inherit;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            background:
                linear-gradient(
                    135deg,
                    var(--primary-dark),
                    var(--primary)
                );

            color: white;

            text-align: center;

            padding:
                27px 18px 28px;

            box-shadow:
                0 4px 18px
                rgba(15, 23, 42, 0.10);
        }


        header h1 {
            margin: 0;

            font-size: 21px;

            font-weight: 700;

            letter-spacing: -0.3px;
        }


        header p {
            margin:
                7px 0 0;

            font-size: 13px;

            opacity: 0.88;
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {
            width: 100%;

            max-width: 720px;

            margin: 0 auto;

            padding:
                18px 14px 40px;
        }


        /* =========================
           KEMBALI
        ========================= */

        .btn-kembali {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding:
                10px 18px;

            margin-bottom: 16px;

            background: white;

            color: #334155;

            border:
                1px solid
                var(--border);

            border-radius: 12px;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;

            box-shadow:
                0 2px 8px
                rgba(15, 23, 42, 0.04);

            transition:
                background 0.2s ease,
                color 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                transform 0.2s ease;
        }


        .btn-kembali:hover {
            color: var(--primary);

            background: #f8fafc;

            border-color: #cbd5e1;

            box-shadow:
                0 6px 16px
                rgba(15, 23, 42, 0.08);
        }


        .btn-kembali:active {
            transform:
                scale(0.97);
        }


        /* =========================
           CARD
        ========================= */

        .card {
            background: var(--white);

            border:
                1px solid
                #e8edf3;

            border-radius: 18px;

            padding:
                22px 18px;

            box-shadow:
                0 8px 28px
                rgba(15, 23, 42, 0.07);

            margin-bottom: 20px;
        }


        .card-title {
            margin-bottom: 18px;

            color: var(--primary-dark);

            font-size: 17px;

            font-weight: 700;
        }


        /* =========================
           FORM
        ========================= */

        .form-group {
            margin-bottom: 20px;
        }


        label.form-label {
            display: block;

            margin-bottom: 8px;

            color: #334155;

            font-size: 14px;

            font-weight: 600;
        }


        input[type="text"],
        textarea {
            width: 100%;

            padding:
                13px 14px;

            border:
                1px solid
                #d8e0e8;

            border-radius: 11px;

            background: white;

            color: var(--text);

            font-family: inherit;

            font-size: 15px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }


        input[type="text"]::placeholder,
        textarea::placeholder {
            color: #94a3b8;
        }


        input[type="text"]:focus,
        textarea:focus {
            border-color:
                var(--primary);

            box-shadow:
                0 0 0 3px
                rgba(31, 78, 121, 0.10);
        }


        textarea {
            min-height: 170px;

            resize: vertical;

            line-height: 1.7;
        }


        /* =========================
           FILE PICKER
        ========================= */

        .file-picker {
            position: relative;

            width: 100%;

            min-height: 125px;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 18px;

            border:
                1.5px dashed
                #b8c7d8;

            border-radius: 15px;

            background:
                linear-gradient(
                    180deg,
                    #fbfdff,
                    #f6f9fc
                );

            cursor: pointer;

            overflow: hidden;

            transition:
                border-color 0.2s ease,
                background 0.2s ease,
                transform 0.2s ease;
        }


        .file-picker:hover {
            border-color:
                var(--primary);

            background:
                var(--primary-light);
        }


        .file-picker:active {
            transform:
                scale(0.99);
        }


        .file-picker input[type="file"] {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            opacity: 0;

            cursor: pointer;

            z-index: 10;
        }


        .file-picker-content {
            position: relative;

            z-index: 1;

            text-align: center;

            pointer-events: none;
        }


        .file-button {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-width: 125px;

            padding:
                11px 18px;

            border-radius: 10px;

            background:
                var(--primary);

            color: white;

            font-size: 14px;

            font-weight: 700;

            box-shadow:
                0 5px 12px
                rgba(31, 78, 121, 0.18);
        }


        .file-hint {
            margin-top: 9px;

            color: #64748b;

            font-size: 12px;
        }


        /* =========================
           INFO FILE
        ========================= */

        .info-file {
            margin-top: 11px;

            padding:
                12px 13px;

            background: #f8fafc;

            border:
                1px solid
                #e5eaf0;

            border-radius: 11px;

            color: #475569;

            font-size: 13px;

            line-height: 1.55;

            display: none;

            word-break: break-word;
        }


        /* =========================
           TOMBOL UTAMA
        ========================= */

        .button-group {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;

            margin-top: 6px;
        }


        .btn-upload,
        .btn-batal-edit {
            width: 100%;

            padding:
                14px 18px;

            border: none;

            border-radius: 12px;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                opacity 0.2s ease;
        }


        .btn-upload {
            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    #28649a
                );

            color: white;

            box-shadow:
                0 7px 17px
                rgba(31, 78, 121, 0.20);
        }


        .btn-upload:hover {
            transform:
                translateY(-1px);

            box-shadow:
                0 10px 22px
                rgba(31, 78, 121, 0.25);
        }


        .btn-upload:disabled {
            background: #94a3b8;

            box-shadow: none;

            cursor: not-allowed;

            opacity: 0.8;

            transform: none;
        }


        .btn-batal-edit {
            display: none;

            background: #f1f5f9;

            color: #475569;

            border:
                1px solid
                #dbe3ea;
        }


        .btn-batal-edit:hover {
            background: #e8eef3;
        }


        /* =========================
           STATUS
        ========================= */

        #status {
            margin-top: 14px;

            padding:
                11px 12px;

            border-radius: 10px;

            text-align: center;

            color: #475569;

            font-size: 13px;

            line-height: 1.5;

            word-break: break-word;
        }


        /* =========================
           DAFTAR PENGUMUMAN
        ========================= */

        .daftar-card {
            background: white;

            border:
                1px solid
                #e8edf3;

            border-radius: 18px;

            padding:
                20px 18px;

            box-shadow:
                0 8px 28px
                rgba(15, 23, 42, 0.06);
        }


        .daftar-title {
            margin-bottom: 15px;

            color:
                var(--primary-dark);

            font-size: 17px;

            font-weight: 700;
        }


        #daftarPengumuman {
            display: flex;

            flex-direction: column;

            gap: 12px;
        }


        .pengumuman-item {
            display: flex;

            align-items: flex-start;

            gap: 13px;

            padding:
                15px;

            border:
                1px solid
                #e2e8f0;

            border-radius: 12px;

            background:
                #ffffff;
        }


        .pengumuman-icon {
            flex:
                0 0 42px;

            width: 42px;
            height: 42px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background:
                #edf4fa;

            color:
                var(--primary);

            font-size: 18px;

            font-weight: 700;
        }


        .pengumuman-info {
            flex: 1;

            min-width: 0;
        }


        .pengumuman-judul {
            color:
                var(--primary-dark);

            font-size: 14px;

            font-weight: 700;

            line-height: 1.45;

            word-break: break-word;
        }


        .pengumuman-tanggal {
            margin-top: 4px;

            color:
                var(--muted);

            font-size: 11px;
        }


        .pengumuman-file {
            margin-top: 6px;

            color:
                #64748b;

            font-size: 11px;

            word-break: break-word;
        }


        .pengumuman-actions {
            flex:
                0 0 auto;

            display: flex;

            flex-direction: column;

            gap: 6px;
        }


        .btn-edit,
        .btn-hapus {
            min-width: 70px;

            padding:
                7px 10px;

            border-radius: 7px;

            font-size: 11px;

            font-weight: 700;

            cursor: pointer;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                color 0.2s ease;
        }


        .btn-edit {
            border:
                1px solid
                #bfdbfe;

            background:
                var(--edit-light);

            color:
                var(--edit);
        }


        .btn-edit:hover {
            background:
                #dbeafe;
        }


        .btn-hapus {
            border:
                1px solid
                #fecaca;

            background:
                var(--danger-light);

            color:
                var(--danger);
        }


        .btn-hapus:hover {
            background:
                #fee2e2;
        }


        .daftar-loading {
            padding:
                25px 10px;

            text-align: center;

            color:
                var(--muted);

            font-size: 13px;
        }


        .daftar-kosong {
            padding:
                25px 10px;

            text-align: center;

            color:
                var(--muted);

            font-size: 13px;
        }


        /* =========================
           MODAL KONFIRMASI
        ========================= */

        .confirm-overlay {
            position: fixed;

            inset: 0;

            z-index: 1000;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                rgba(15, 23, 42, 0.55);
        }


        .confirm-overlay.active {
            display: flex;
        }


        .confirm-box {
            width:
                min(400px, 100%);

            padding:
                22px;

            border-radius: 16px;

            background: white;

            box-shadow:
                0 20px 60px
                rgba(15, 23, 42, 0.20);
        }


        .confirm-title {
            color:
                var(--primary-dark);

            font-size: 17px;

            font-weight: 700;
        }


        .confirm-text {
            margin-top: 8px;

            color:
                var(--muted);

            font-size: 13px;

            line-height: 1.6;
        }


        .confirm-actions {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;

            margin-top: 20px;
        }


        .btn-confirm-cancel,
        .btn-confirm-delete {
            padding:
                11px;

            border-radius: 9px;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;
        }


        .btn-confirm-cancel {
            border:
                1px solid
                #dbe3ea;

            background:
                #f8fafc;

            color:
                #475569;
        }


        .btn-confirm-delete {
            border:
                1px solid
                var(--danger);

            background:
                var(--danger);

            color:
                white;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header {
                padding:
                    23px 15px 24px;
            }


            header h1 {
                font-size: 18px;
            }


            header p {
                font-size: 12px;
            }


            .container {
                padding:
                    15px 12px 30px;
            }


            .card,
            .daftar-card {
                padding:
                    19px 14px;
            }


            .button-group {
                grid-template-columns: 1fr;
            }


            .pengumuman-item {
                gap: 10px;

                padding:
                    13px;
            }


            .pengumuman-icon {
                flex-basis: 38px;

                width: 38px;
                height: 38px;

                font-size: 16px;
            }


            .pengumuman-actions {
                gap: 5px;
            }


            .btn-edit,
            .btn-hapus {
                min-width: 58px;

                padding:
                    7px 8px;

                font-size: 10px;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>
        GPIL Jemaat Betesda Purwosari
    </h1>

    <p>
        Kelola Pengumuman dan Dokumen
    </p>

</header>


<div class="container">


    <!-- =========================
         KEMBALI
    ========================== -->

    <a
        href="kelola-admin.html"
        class="btn-kembali"
    >
        ← Kembali
    </a>


    <!-- =========================
         FORM
    ========================== -->

    <div class="card">

        <div class="card-title">
            <span id="formTitle">
                Tambah Pengumuman
            </span>
        </div>


        <!-- JUDUL -->

        <div class="form-group">

            <label
                for="judul"
                class="form-label"
            >
                Judul Pengumuman
            </label>


            <input
                type="text"
                id="judul"
                placeholder="Masukkan judul pengumuman"
                autocomplete="off"
            >

        </div>


        <!-- ISI PENGUMUMAN -->

        <div class="form-group">

            <label
                for="keterangan"
                class="form-label"
            >
                Isi Pengumuman
            </label>


            <textarea
                id="keterangan"
                placeholder="Tuliskan isi pengumuman di sini..."
            ></textarea>

        </div>


        <!-- FILE -->

        <div class="form-group">

            <label
                class="form-label"
            >
                Dokumen / File
            </label>


            <label class="file-picker">

                <input
                    type="file"
                    id="file"
                    accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.jpg,.jpeg,.png,.gif,.webp,.txt,.csv,.rtf,.odt,.ods,.odp,.zip,.rar,.7z"
                >


                <div
                    class="file-picker-content"
                >

                    <div class="file-button">
                        Pilih File
                    </div>


                    <div class="file-hint">
                        Opsional • Maksimal 20 MB
                    </div>

                </div>

            </label>


            <div
                id="infoFile"
                class="info-file"
            ></div>

        </div>


        <!-- TOMBOL -->

        <div class="button-group">

            <button
                type="button"
                id="btnUpload"
                class="btn-upload"
                onclick="simpanPengumuman()"
            >
                Publikasikan Pengumuman
            </button>


            <button
                type="button"
                id="btnBatalEdit"
                class="btn-batal-edit"
                onclick="batalEdit()"
            >
                Batal Edit
            </button>

        </div>


        <div id="status"></div>

    </div>


    <!-- =========================
         DAFTAR PENGUMUMAN
    ========================== -->

    <div class="daftar-card">

        <div class="daftar-title">
            Daftar Pengumuman
        </div>


        <div id="daftarPengumuman">

            <div class="daftar-loading">
                Memuat pengumuman...
            </div>

        </div>

    </div>

</div>


<!-- =========================
     MODAL HAPUS
========================== -->

<div
    id="confirmOverlay"
    class="confirm-overlay"
>

    <div class="confirm-box">

        <div class="confirm-title">
            Hapus Pengumuman?
        </div>


        <div
            id="confirmText"
            class="confirm-text"
        >
            Pengumuman akan dihapus secara permanen.
        </div>


        <div class="confirm-actions">

            <button
                type="button"
                class="btn-confirm-cancel"
                onclick="tutupKonfirmasiHapus()"
            >
                Batal
            </button>


            <button
                type="button"
                class="btn-confirm-delete"
                onclick="lanjutkanHapus()"
            >
                Hapus
            </button>

        </div>

    </div>

</div>


<!-- =========================
     SUPABASE
========================== -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="supabase-client.js"></script>

<script src="kelola-pengumuman.js?v=4"></script>


</body>

</html>
