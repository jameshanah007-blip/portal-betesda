<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Buku Kas Pemuda</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            padding: 15px;

            background: #f4f6f8;

            font-family: Arial, sans-serif;

            color: #222;
        }


        .container {
            width: 100%;
            max-width: 600px;

            margin: 0 auto;
        }


        /* ================================
           HEADER
        ================================= */

        .header {
            background: #1f4e79;

            color: white;

            padding: 20px 15px;

            border-radius: 12px;

            margin-bottom: 15px;

            text-align: center;
        }


        .header h1 {
            margin: 0 0 8px 0;

            font-size: 24px;
        }


        .header p {
            margin: 0;

            font-size: 14px;

            line-height: 1.5;
        }


        /* ================================
           TOMBOL KEMBALI
        ================================= */

        .btn-kembali {
            display: block;

            width: 100%;

            min-height: 48px;

            padding: 13px;

            margin-bottom: 15px;

            background: white;

            color: #1f4e79;

            border: 1px solid #1f4e79;

            border-radius: 10px;

            text-align: center;

            text-decoration: none;

            font-size: 16px;

            font-weight: bold;
        }


        /* ================================
           DASHBOARD
        ================================= */

        .dashboard {
            display: grid;

            grid-template-columns: 1fr;

            gap: 10px;

            margin-bottom: 15px;
        }


        .card {
            background: white;

            padding: 15px;

            border-radius: 10px;

            box-shadow:
                0 2px 6px rgba(0, 0, 0, 0.08);
        }


        .card-title {
            font-size: 14px;

            color: #666;

            margin-bottom: 8px;

            text-align: center;
        }


        .card-value {
            font-size: 22px;

            font-weight: bold;

            text-align: center;
        }


        /* ================================
           FORM
        ================================= */

        .form-box {
            background: white;

            padding: 15px;

            border-radius: 10px;

            margin-bottom: 15px;
        }


        .form-box h2 {
            margin-top: 0;

            font-size: 20px;
        }


        .form-group {
            margin-bottom: 14px;
        }


        .form-group label {
            display: block;

            margin-bottom: 6px;

            font-weight: bold;

            font-size: 15px;
        }


        input,
        select {

            width: 100%;

            min-height: 48px;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;

            background: white;
        }


        input:focus,
        select:focus {

            outline: none;

            border-color: #1f4e79;

            box-shadow:
                0 0 0 2px rgba(
                    31,
                    78,
                    121,
                    0.10
                );
        }


        #jenis {
            appearance: auto;

            cursor: pointer;
        }


        /* ================================
           TOMBOL SIMPAN
        ================================= */

        .btn-simpan {

            width: 100%;

            min-height: 50px;

            border: none;

            border-radius: 10px;

            background: #1f4e79;

            color: white;

            font-size: 17px;

            font-weight: bold;

            padding: 12px;

            cursor: pointer;
        }


        .btn-simpan:active {
            opacity: 0.8;
        }


        .btn-simpan:disabled {

            opacity: 0.6;

            cursor: not-allowed;
        }


        /* ================================
           TOMBOL BATAL
        ================================= */

        .btn-batal {

            width: 100%;

            min-height: 48px;

            margin-top: 10px;

            border: 1px solid #999;

            border-radius: 10px;

            background: white;

            color: #444;

            font-size: 16px;

            cursor: pointer;
        }


        /* ================================
           RIWAYAT
        ================================= */

        .riwayat-box {

            background: white;

            padding: 15px;

            border-radius: 10px;

            margin-bottom: 15px;
        }


        .riwayat-box h2 {

            margin-top: 0;

            font-size: 20px;
        }


        .table-wrapper {

            width: 100%;

            overflow-x: auto;
        }


        table {

            width: 100%;

            min-width: 600px;

            border-collapse: collapse;
        }


        th,
        td {

            padding: 10px 8px;

            border-bottom: 1px solid #ddd;

            text-align: left;

            font-size: 14px;
        }


        th:nth-child(5),
        td:nth-child(5) {

            text-align: center !important;
        }


        th {

            background: #f0f2f4;
        }


        /* ================================
           TOMBOL EDIT & HAPUS
        ================================= */

        .btn-edit,
        .btn-hapus {

            min-height: 40px;

            padding: 8px 10px;

            border-radius: 7px;

            border: none;

            font-size: 14px;

            cursor: pointer;
        }


        .btn-edit {

            background: #e8f1fa;

            color: #1f4e79;
        }


        .btn-hapus {

            background: #fdeaea;

            color: #b00020;
        }


        /* ================================
           DATA KOSONG
        ================================= */

        .kosong {

            text-align: center;

            color: #777;

            padding: 20px;
        }


        /* ================================
           DESKTOP
        ================================= */

        @media (min-width: 500px) {

            .dashboard {

                grid-template-columns:
                    repeat(3, 1fr);
            }


            .card-value {

                font-size: 18px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =================================
         KEMBALI KE KELOLA LAPORAN
    ================================= -->

    <a
        href="kelola-laporan-keuangan.html"
        class="btn-kembali"
    >
        ← Kembali ke Kelola Laporan Keuangan
    </a>


    <!-- =================================
         HEADER
    ================================= -->

    <div class="header">

        <h1>
            Buku Kas Pemuda
        </h1>

        <p>
            Persekutuan Pemuda GPIL Jemaat Betesda Purwosari
        </p>

    </div>


    <!-- =================================
         DASHBOARD
    ================================= -->

    <div class="dashboard">


        <div class="card">

            <div class="card-title">
                Total Pemasukan
            </div>

            <div
                class="card-value"
                id="totalIncome"
            >
                Rp 0
            </div>

        </div>


        <div class="card">

            <div class="card-title">
                Total Pengeluaran
            </div>

            <div
                class="card-value"
                id="totalExpense"
            >
                Rp 0
            </div>

        </div>


        <div class="card">

            <div class="card-title">
                Saldo
            </div>

            <div
                class="card-value"
                id="balance"
            >
                Rp 0
            </div>

        </div>


    </div>


    <!-- =================================
         FORM TRANSAKSI
    ================================= -->

    <div class="form-box">


        <h2>
            Input Transaksi
        </h2>


        <form id="transactionForm">


            <!-- TANGGAL -->

            <div class="form-group">

                <label for="tanggal">
                    Tanggal
                </label>

                <input
                    type="date"
                    id="tanggal"
                    required
                >

            </div>


            <!-- KETERANGAN -->

            <div class="form-group">

                <label for="keterangan">
                    Keterangan
                </label>

                <input
                    type="text"
                    id="keterangan"
                    placeholder="Contoh: Iuran Pemuda"
                    required
                >

            </div>


            <!-- JUMLAH -->

            <div class="form-group">

                <label for="jumlah">
                    Jumlah
                </label>

                <input
                    type="text"
                    id="jumlah"
                    inputmode="numeric"
                    placeholder="Contoh: 100.000"
                    required
                >

            </div>


            <!-- JENIS -->

            <div class="form-group">

                <label for="jenis">
                    Jenis Transaksi
                </label>

                <select
                    id="jenis"
                    required
                >

                    <option
                        value=""
                        selected
                        disabled
                        hidden
                    >
                        Pilih jenis transaksi
                    </option>

                    <option value="Pemasukan">
                        Pemasukan
                    </option>

                    <option value="Pengeluaran">
                        Pengeluaran
                    </option>

                </select>

            </div>


            <!-- SIMPAN -->

            <button
                type="submit"
                class="btn-simpan"
                id="saveButton"
            >
                Simpan Transaksi
            </button>


            <!-- BATAL -->

            <button
                type="button"
                class="btn-batal"
                id="cancelButton"
                style="display: none;"
            >
                Batal Edit
            </button>


        </form>

    </div>


    <!-- =================================
         RIWAYAT TRANSAKSI
    ================================= -->

    <div class="riwayat-box">


        <h2>
            Riwayat Transaksi
        </h2>


        <div class="table-wrapper">


            <table>


                <thead>

                    <tr>

                        <th>
                            No
                        </th>

                        <th>
                            Tanggal
                        </th>

                        <th>
                            Keterangan
                        </th>

                        <th>
                            Jenis
                        </th>

                        <th>
                            Jumlah
                        </th>

                        <th>
                            Aksi
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="transactionTable"
                >
                </tbody>


            </table>

        </div>

    </div>


</div>


<!-- =================================
     SUPABASE
================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
    src="supabase-client.js"
></script>


<script
    src="buku-kas-pemuda.js"
></script>


</body>

</html>
