<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Laporan Keuangan Pemuda</title>

    <link
        rel="stylesheet"
        href="laporan.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 15px;
            background: #f4f6f8;
            font-family: Arial, sans-serif;
        }

        .laporan-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .btn-kembali {
            display: block;
            width: 100%;
            min-height: 48px;

            margin-bottom: 15px;
            padding: 13px;

            background: white;
            color: #1f4e79;

            border: 1px solid #1f4e79;
            border-radius: 10px;

            text-align: center;
            text-decoration: none;

            font-size: 16px;
            font-weight: bold;
        }

        .judul {
            background: #1f4e79;
            color: white;

            padding: 20px 15px;

            border-radius: 12px;

            text-align: center;

            margin-bottom: 15px;
        }

        .judul h1 {
            margin: 0 0 8px 0;
            font-size: 24px;
        }

        .judul p {
            margin: 0;
            font-size: 14px;
            line-height: 1.5;
        }

        .filter-box {
            background: white;

            padding: 15px;

            border-radius: 10px;

            margin-bottom: 15px;
        }

        .filter-group {
            margin-bottom: 12px;
        }

        .filter-group label {
            display: block;

            margin-bottom: 6px;

            font-weight: bold;
        }

        input[type="month"] {
            width: 100%;
            min-height: 48px;

            padding: 10px;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 16px;
        }

        .btn-tampilkan {
            width: 100%;
            min-height: 50px;

            border: none;
            border-radius: 10px;

            background: #1f4e79;
            color: white;

            font-size: 17px;
            font-weight: bold;
        }

        .export-box {
            display: grid;

            grid-template-columns: 1fr;

            gap: 10px;

            margin-top: 10px;
        }

        .btn-export {
            width: 100%;
            min-height: 48px;

            border: none;
            border-radius: 10px;

            font-size: 16px;
            font-weight: bold;
        }

        .btn-excel {
            background: #2e7d32;
            color: white;
        }

        .btn-pdf {
            background: #b00020;
            color: white;
        }

        .laporan-paper {
            background: white;

            padding: 15px;

            border-radius: 10px;

            margin-bottom: 20px;
        }

        .laporan-header {
            text-align: center;

            margin-bottom: 20px;
        }

        .laporan-header h2 {
            margin: 0 0 5px 0;

            font-size: 20px;
        }

        .laporan-header p {
            margin: 5px 0;

            font-size: 14px;
        }

        .saldo-awal {
            margin-bottom: 15px;

            padding: 12px;

            background: #f0f2f4;

            border-radius: 8px;

            font-weight: bold;
        }

        .table-wrapper {
            width: 100%;

            overflow-x: auto;
        }

        table {
            width: 100%;

            min-width: 650px;

            border-collapse: collapse;
        }

        th,
        td {
            padding: 10px 8px;

            border-bottom: 1px solid #ddd;

            font-size: 14px;
        }

        th {
            background: #1f4e79;
            color: white;
        }

        .keterangan {
            min-width: 180px;
        }

        .kosong {
            text-align: center;

            padding: 20px;

            color: #777;
        }

        .ringkasan {
            margin-top: 20px;
        }

        .ringkasan div {
            padding: 10px 0;

            border-bottom: 1px solid #ddd;

            font-size: 15px;
        }

        @media (min-width: 600px) {

            .export-box {
                grid-template-columns: 1fr 1fr;
            }

            .filter-box {
                display: grid;

                grid-template-columns: 1fr 1fr;

                gap: 10px;
            }

            .filter-group {
                margin-bottom: 0;
            }

            .btn-tampilkan {
                grid-column: 1 / 3;
            }
        }

    </style>

</head>

<body>

<div class="laporan-container">

    <a
        href="buku-kas-pemuda.html"
        class="btn-kembali"
    >
        ← Kembali ke Buku Kas
    </a>


    <div class="judul">

        <h1>
            Laporan Keuangan Pemuda
        </h1>

        <p>
            Persekutuan Pemuda GPIL Jemaat Betesda Purwosari
        </p>

    </div>


    <!-- FILTER -->
    <div class="filter-box">

        <div class="filter-group">

            <label for="bulanMulai">
                Bulan Mulai
            </label>

            <input
                type="month"
                id="bulanMulai"
            >

        </div>


        <div class="filter-group">

            <label for="bulanSampai">
                Bulan Sampai
            </label>

            <input
                type="month"
                id="bulanSampai"
            >

        </div>


        <button
            type="button"
            id="btnTampilkan"
            class="btn-tampilkan"
        >
            Tampilkan Laporan
        </button>

    </div>


    <!-- EXPORT -->
    <div class="export-box">

        <button
            type="button"
            id="btnExcel"
            class="btn-export btn-excel"
        >
            Export Excel
        </button>


        <button
            type="button"
            id="btnPdf"
            class="btn-export btn-pdf"
        >
            Export PDF
        </button>

    </div>


    <!-- LAPORAN -->
    <div class="laporan-paper">

        <div class="laporan-header">

            <h2>
                LAPORAN KEUANGAN
            </h2>

            <p>
                Persekutuan Pemuda GPIL Jemaat Betesda Purwosari
            </p>

            <p id="periodeLaporan">
                -
            </p>

        </div>


        <div class="saldo-awal">

            Saldo Awal:

            <span id="saldoAwal">
                Rp 0
            </span>

        </div>


        <div class="table-wrapper">

            <table id="laporanTable">

                <thead>

                    <tr>

                        <th>No</th>

                        <th>Tanggal</th>

                        <th>Keterangan</th>

                        <th>Pemasukan</th>

                        <th>Pengeluaran</th>

                        <th>Saldo</th>

                    </tr>

                </thead>


                <tbody id="laporanBody">
                </tbody>

            </table>

        </div>


        <!-- RINGKASAN -->
        <div class="ringkasan">

            <div>

                Total Pemasukan:

                <strong id="totalPemasukan">
                    Rp 0
                </strong>

            </div>


            <div>

                Total Pengeluaran:

                <strong id="totalPengeluaran">
                    Rp 0
                </strong>

            </div>


            <div>

                Saldo Akhir:

                <strong id="saldoAkhir">
                    Rp 0
                </strong>

            </div>

        </div>

    </div>

</div>


<!-- LIBRARY EXCEL -->
<script src="xlsx.full.min.js"></script>

<!-- LIBRARY PDF -->
<script src="jspdf.umd.min.js"></script>

<script src="jspdf.plugin.autotable.min.js"></script>

<!-- JAVASCRIPT LAPORAN -->
<script src="laporan-pemuda.js"></script>

</body>
</html>
