<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Laporan Keuangan Pemuda</title>

    <link rel="stylesheet" href="laporan.css">
</head>

<body>

    <div class="container">

        <h1>Laporan Keuangan Pemuda</h1>

        <!-- FILTER PERIODE -->
        <div class="filter-box">

            <div class="filter-item">
                <label for="bulanMulai">Dari Bulan</label>
                <input
                    type="month"
                    id="bulanMulai"
                    name="bulanMulai"
                >
            </div>

            <div class="filter-item">
                <label for="bulanSampai">Sampai Bulan</label>
                <input
                    type="month"
                    id="bulanSampai"
                    name="bulanSampai"
                >
            </div>

            <button type="button" id="btnTampilkan">
                Tampilkan Laporan
            </button>

        </div>


        <!-- INFORMASI PERIODE -->
        <div class="report-info">

            <h2 id="periodeLaporan">
                Laporan Keuangan
            </h2>

            <p>
                Saldo Awal:
                <strong id="saldoAwal">Rp 0</strong>
            </p>

        </div>


        <!-- RINGKASAN -->
        <div class="summary">

            <div class="summary-box">
                <span>Total Pemasukan</span>
                <strong id="totalPemasukan">
                    Rp 0
                </strong>
            </div>

            <div class="summary-box">
                <span>Total Pengeluaran</span>
                <strong id="totalPengeluaran">
                    Rp 0
                </strong>
            </div>

            <div class="summary-box">
                <span>Saldo Akhir</span>
                <strong id="saldoAkhir">
                    Rp 0
                </strong>
            </div>

        </div>


        <!-- TABEL LAPORAN -->
        <div class="table-container">

            <table id="laporanTable">

                <thead>
                    <tr>
                        <th>No</th>
                        <th>Tanggal</th>
                        <th>Keterangan</th>
                        <th>Jenis</th>
                        <th>Jumlah</th>
                        <th>Saldo</th>
                    </tr>
                </thead>

                <tbody id="laporanBody">
                    <!-- Data transaksi akan dimuat oleh JavaScript -->
                </tbody>

                <tfoot id="laporanFooter">
                    <!-- Total akan dibuat oleh JavaScript -->
                </tfoot>

            </table>

        </div>


        <!-- TOMBOL EXPORT -->
        <div class="export-box">

            <button type="button" id="btnExcel">
                Export Excel
            </button>

            <button type="button" id="btnPdf">
                Export PDF
            </button>

        </div>

    </div>


    <!-- ==================================================
         LIBRARY EXPORT EXCEL
         ================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>


    <!-- ==================================================
         LIBRARY PDF
         ================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>


    <!-- ==================================================
         SUPABASE
         ================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-client.js"></script>


    <!-- ==================================================
         JAVASCRIPT LAPORAN PEMUDA
         ================================================== -->

    <script src="laporan-pemuda.js"></script>

</body>
</html>
