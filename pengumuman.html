<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Informasi Jemaat</title>

    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f4f7fa;

            color: #1e293b;

            -webkit-font-smoothing: antialiased;
        }


        /* =========================================
           HEADER
        ========================================= */

        .site-header {
            position: sticky;

            top: 0;

            z-index: 100;

            background: rgba(255, 255, 255, 0.97);

            border-bottom:
                1px solid #e2e8f0;

            box-shadow:
                0 2px 10px
                rgba(15, 23, 42, 0.04);
        }

        .header-container {
            max-width: 1150px;

            margin: 0 auto;

            padding: 16px 20px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 25px;
        }


        /* =========================================
           BRAND
        ========================================= */

        .brand {
            display: block;

            min-width: 0;

            color: #173f67;

            text-decoration: none;
        }

        .brand-title {
            display: block;

            font-size: 17px;

            font-weight: 700;

            line-height: 1.35;

            letter-spacing: -0.2px;
        }

        .brand-subtitle {
            display: block;

            margin-top: 3px;

            color: #64748b;

            font-size: 11px;

            line-height: 1.4;
        }


        /* =========================================
           NAVIGASI
        ========================================= */

        .main-nav {
            display: flex;

            align-items: center;

            gap: 4px;
        }

        .main-nav a {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding: 8px 11px;

            border-radius: 7px;

            color: #475569;

            font-size: 13px;

            font-weight: 600;

            text-decoration: none;

            transition:
                color 0.2s ease,
                background 0.2s ease;
        }

        .main-nav a:hover {
            background: #eef5fa;

            color: #245d8f;
        }

        .main-nav a[aria-current="page"] {
            background: #eef5fa;

            color: #245d8f;
        }


        /* =========================================
           KONTEN
        ========================================= */

        .page-container {
            width: 100%;

            max-width: 1080px;

            margin: 0 auto;

            padding:
                42px 20px
                70px;
        }


        /* =========================================
           DAFTAR INFORMASI
        ========================================= */

        #daftarPengumuman {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 20px;
        }


        /* =========================================
           KARTU INFORMASI
        ========================================= */

        .dokumen-card {
            position: relative;

            width: 100%;

            min-height: 110px;

            display: flex;

            align-items: center;

            gap: 17px;

            padding:
                20px 19px;

            background: #ffffff;

            border:
                1px solid #e2e8f0;

            border-radius: 12px;

            box-shadow:
                0 3px 12px
                rgba(23, 63, 103, 0.045);

            cursor: pointer;

            text-align: left;

            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .dokumen-card::before {
            content: "";

            position: absolute;

            left: 0;

            top: 18px;

            bottom: 18px;

            width: 3px;

            border-radius:
                0 4px 4px 0;

            background: #245d8f;

            opacity: 0;

            transition:
                opacity 0.2s ease;
        }

        .dokumen-card:hover {
            transform:
                translateY(-3px);

            border-color:
                #c6d6e3;

            box-shadow:
                0 9px 24px
                rgba(23, 63, 103, 0.09);
        }

        .dokumen-card:hover::before {
            opacity: 1;
        }


        /* =========================================
           IKON CSS
           Tidak menggunakan emoji
        ========================================= */

        .file-icon {
            position: relative;

            flex: 0 0 auto;

            width: 45px;

            height: 53px;

            border:
                1px solid #b8c9d7;

            border-radius: 8px;

            background: #f8fbfd;
        }

        .file-icon::before {
            content: "";

            position: absolute;

            top: -1px;

            right: -1px;

            width: 15px;

            height: 15px;

            background: #ffffff;

            border-left:
                1px solid #b8c9d7;

            border-bottom:
                1px solid #b8c9d7;

            border-bottom-left-radius: 5px;
        }

        .file-icon::after {
            content: "";

            position: absolute;

            left: 9px;

            right: 9px;

            top: 27px;

            height: 2px;

            border-radius: 2px;

            background: #9fb4c6;

            box-shadow:
                0 7px 0 #9fb4c6,
                0 14px 0 #9fb4c6;
        }


        /* =========================================
           ISI KARTU
        ========================================= */

        .dokumen-info {
            flex: 1 1 auto;

            min-width: 0;

            padding:
                0 3px;
        }

        .dokumen-title {
            margin: 0;

            color: #173f67;

            font-size: 15px;

            font-weight: 700;

            line-height: 1.45;

            word-break: break-word;
        }

        .dokumen-meta {
            margin-top: 7px;

            color: #64748b;

            font-size: 11px;

            line-height: 1.5;
        }

        .format-badge {
            display: inline-flex;

            align-items: center;

            padding:
                4px 8px;

            border:
                1px solid #d9e6ef;

            border-radius: 5px;

            background: #f2f7fa;

            color: #245d8f;

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 0.5px;
        }


        /* =========================================
           PANAH
        ========================================= */

        .open-arrow {
            flex: 0 0 auto;

            width: 28px;

            height: 28px;

            display: flex;

            align-items: center;

            justify-content: center;

            border:
                1px solid #e2e8f0;

            border-radius: 7px;

            color: #94a3b8;

            font-size: 16px;

            line-height: 1;

            transition:
                color 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease;
        }

        .dokumen-card:hover .open-arrow {
            background: #245d8f;

            border-color: #245d8f;

            color: #ffffff;

            transform:
                translateX(2px);
        }


        /* =========================================
           STATUS
        ========================================= */

        .status-message {
            grid-column:
                1 / -1;

            padding:
                55px 25px;

            background: #ffffff;

            border:
                1px solid #e2e8f0;

            border-radius: 12px;

            color: #64748b;

            font-size: 14px;

            line-height: 1.6;

            text-align: center;
        }


        /* =========================================
           MODAL
        ========================================= */

        .modal {
            position: fixed;

            inset: 0;

            z-index: 1000;

            display: none;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                rgba(15, 23, 42, 0.58);

            backdrop-filter:
                blur(2px);
        }

        .modal.active {
            display: flex;
        }


        /* =========================================
           BOX MODAL
        ========================================= */

        .modal-box {
            width: 100%;

            max-width: 700px;

            max-height:
                calc(100vh - 40px);

            display: flex;

            flex-direction: column;

            overflow: hidden;

            background: #ffffff;

            border-radius: 14px;

            box-shadow:
                0 24px 70px
                rgba(15, 23, 42, 0.22);

            animation:
                modalMasuk 0.18s ease-out;
        }

        @keyframes modalMasuk {

            from {
                opacity: 0;

                transform:
                    translateY(8px)
                    scale(0.99);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }

        }


        /* =========================================
           HEADER MODAL
        ========================================= */

        .modal-header {
            display: flex;

            align-items: flex-start;

            justify-content: space-between;

            gap: 18px;

            padding:
                21px 32px;

            background: #ffffff;

            border-bottom:
                1px solid #e5ebf0;
        }

        .modal-header > div:first-child {
            flex: 1 1 auto;

            min-width: 0;

            padding: 0;
        }

        #modalJudul {
            margin: 0;

            padding: 0;

            color: #173f67;

            font-size: 18px;

            font-weight: 700;

            line-height: 1.45;

            text-align: left;
        }

        #modalNamaFile {
            margin:
                5px 0 0;

            padding: 0;

            color: #64748b;

            font-size: 11px;

            line-height: 1.5;

            text-align: left;
        }


        /* =========================================
           TOMBOL TUTUP
        ========================================= */

        #btnTutup {
            flex: 0 0 auto;

            width: 32px;

            height: 32px;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 0;

            border:
                1px solid #e2e8f0;

            border-radius: 7px;

            background: #f8fafc;

            color: #64748b;

            font-size: 20px;

            line-height: 1;

            cursor: pointer;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                color 0.2s ease;
        }

        #btnTutup:hover {
            background: #eef2f6;

            border-color: #cbd5e1;

            color: #173f67;
        }


        /* =========================================
           ISI MODAL
        ========================================= */

        .modal-content {
            width: 100%;

            margin: 0 !important;

            padding: 0 !important;

            overflow-y: auto;

            background: #ffffff;

            text-align: left !important;
        }

        .modal-content,
        .modal-content * {
            text-align: left !important;
        }


        /* =========================================
           TEKS PENGUMUMAN
        ========================================= */

        .modal-keterangan {
            display: none;

            width: 100%;

            margin: 0;

            padding:
                26px 32px
                28px;

            background: #ffffff;

            color: #334155;

            font-size: 14px;

            line-height: 1.85;

            text-align: left !important;

            text-indent: 0 !important;

            white-space: pre-wrap;

            word-break: break-word;

            overflow-wrap: anywhere;

            border-bottom:
                1px solid #e5ebf0;
        }

        .modal-keterangan.active {
            display: block;
        }

        .modal-keterangan,
        .modal-keterangan div,
        .modal-keterangan p,
        .modal-keterangan span {
            margin-top: 0;

            margin-left: 0;

            margin-right: 0;

            padding-top: 0;

            text-align: left !important;

            text-indent: 0 !important;
        }


        /* =========================================
           GAMBAR DALAM MODAL
        ========================================= */

        .modal-content img {
            display: block;

            max-width: 100%;

            height: auto;

            margin: 0 auto;

            padding: 22px;
        }


        /* =========================================
           FOOTER MODAL
        ========================================= */

        .modal-footer {
            display: flex;

            align-items: center;

            justify-content: flex-end;

            padding:
                14px 32px;

            background: #f8fafc;

            border-top:
                1px solid #e5ebf0;
        }

        .btn-download {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-width: 88px;

            padding:
                9px 16px;

            border: none;

            border-radius: 7px;

            background: #245d8f;

            color: #ffffff;

            font-size: 12px;

            font-weight: 700;

            text-decoration: none;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .btn-download:hover {
            background: #173f67;

            transform:
                translateY(-1px);
        }


        /* =========================================
           TABLET
        ========================================= */

        @media (max-width: 850px) {

            .header-container {
                padding:
                    15px 18px;
            }

            .page-container {
                padding:
                    32px 18px
                    55px;
            }

            #daftarPengumuman {
                grid-template-columns: 1fr;
            }

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            .header-container {
                flex-direction: column;

                align-items: flex-start;

                gap: 12px;

                padding:
                    15px 16px;
            }

            .brand-title {
                font-size: 16px;
            }

            .main-nav {
                width: 100%;

                overflow-x: auto;

                gap: 3px;

                padding-bottom: 2px;
            }

            .main-nav a {
                flex: 0 0 auto;

                padding:
                    8px 10px;

                font-size: 12px;
            }

            .page-container {
                padding:
                    22px 14px
                    40px;
            }

            #daftarPengumuman {
                gap: 14px;
            }

            .dokumen-card {
                min-height: 96px;

                gap: 13px;

                padding:
                    16px 15px;
            }

            .file-icon {
                width: 40px;

                height: 48px;
            }

            .file-icon::after {
                left: 8px;

                right: 8px;

                top: 25px;

                box-shadow:
                    0 7px 0 #9fb4c6,
                    0 14px 0 #9fb4c6;
            }

            .dokumen-info {
                padding:
                    0 2px;
            }

            .dokumen-title {
                font-size: 14px;
            }

            .dokumen-meta {
                font-size: 10px;
            }

            .open-arrow {
                width: 26px;

                height: 26px;

                font-size: 15px;
            }


            /* MODAL MOBILE */

            .modal {
                padding: 12px;
            }

            .modal-box {
                max-height:
                    calc(100vh - 24px);

                border-radius: 12px;
            }

            .modal-header {
                padding:
                    17px 24px;
            }

            #modalJudul {
                font-size: 16px;
            }

            .modal-keterangan {
                padding:
                    22px 24px
                    24px;
            }

            .modal-footer {
                padding:
                    12px 24px;
            }

        }


        /* =========================================
           MOBILE KECIL
        ========================================= */

        @media (max-width: 400px) {

            .brand-title {
                font-size: 15px;
            }

            .main-nav a {
                font-size: 11px;

                padding:
                    7px 8px;
            }

            .dokumen-card {
                padding:
                    15px 13px;
            }

            .file-icon {
                width: 37px;

                height: 45px;
            }

            .modal-header {
                padding:
                    16px 20px;
            }

            .modal-keterangan {
                padding:
                    20px 21px
                    22px;
            }

            .modal-footer {
                padding:
                    11px 20px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         HEADER
    ========================================= -->

    <header class="site-header">

        <div class="header-container">

            <a
                href="index.html"
                class="brand">

                <span class="brand-title">
                    GPIL Jemaat Betesda Purwosari
                </span>

                <span class="brand-subtitle">
                    Portal Informasi Jemaat
                </span>

            </a>


            <nav class="main-nav">

                <a href="index.html">
                    Beranda
                </a>

                <a href="jadwal-kumpulan.html">
                    Jadwal
                </a>

                <a
                    href="pengumuman.html"
                    aria-current="page">

                    Informasi

                </a>

                <a href="galeri.html">
                    Galeri
                </a>

                <a href="index.html#laporan">
                    Keuangan
                </a>

                <a href="kelola-admin.html">
                    Admin
                </a>

            </nav>

        </div>

    </header>



    <!-- =========================================
         DAFTAR INFORMASI
         Langsung fokus ke daftar pengumuman.
    ========================================= -->

    <main class="page-container">

        <div id="daftarPengumuman">

            <div class="status-message">
                Memuat informasi...
            </div>

        </div>

    </main>



    <!-- =========================================
         MODAL DETAIL INFORMASI
    ========================================= -->

    <div
        id="modal"
        class="modal"
        aria-hidden="true">


        <div
            class="modal-box"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modalJudul">


            <!-- HEADER MODAL -->

            <div class="modal-header">

                <div>

                    <h2 id="modalJudul">
                    </h2>

                    <div id="modalNamaFile">
                    </div>

                </div>


                <button
                    type="button"
                    id="btnTutup"
                    aria-label="Tutup">

                    ×

                </button>

            </div>


            <!-- ISI MODAL -->

            <div
                id="modalContent"
                class="modal-content">
            </div>


            <!-- FOOTER MODAL -->

            <div class="modal-footer">

                <a
                    id="btnDownload"
                    class="btn-download"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                    download>

                    Download

                </a>

            </div>

        </div>

    </div>



    <!-- =========================================
         SUPABASE
    ========================================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <script src="supabase-client.js"></script>

    <script src="pengumuman.js?v=5"></script>


</body>

</html>
