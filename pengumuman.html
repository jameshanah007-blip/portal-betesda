<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>Informasi & Dokumen</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    180deg,
                    #f8fafc 0%,
                    #eef2f7 100%
                );

            color: #172033;
            min-height: 100vh;
        }

        /* =========================
           TOP BAR
        ========================= */

        .topbar {
            position: sticky;
            top: 0;
            z-index: 50;

            display: flex;
            align-items: center;

            min-height: 64px;
            padding: 10px 16px;

            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            border-bottom: 1px solid rgba(15, 23, 42, 0.08);
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            width: 42px;
            height: 42px;

            border-radius: 12px;

            background: #f1f5f9;
            color: #172033;

            text-decoration: none;

            font-size: 21px;
            font-weight: 600;

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .btn-back:hover {
            background: #e2e8f0;
        }

        .btn-back:active {
            transform: scale(0.94);
        }

        /* =========================
           MAIN
        ========================= */

        main {
            width: 100%;
            max-width: 1100px;

            margin: 0 auto;
            padding: 0 18px 40px;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            padding: 34px 4px 26px;
        }

        .hero h1 {
            margin: 0 0 10px;

            font-size: clamp(
                30px,
                7vw,
                46px
            );

            line-height: 1.12;
            letter-spacing: -1.2px;

            color: #111827;
        }

        .hero p {
            margin: 0;

            max-width: 650px;

            font-size: 15px;
            line-height: 1.7;

            color: #64748b;
        }

        /* =========================
           DOCUMENT LIST
        ========================= */

        #daftarPengumuman {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(
                        280px,
                        1fr
                    )
                );

            gap: 16px;
        }

        /* =========================
           CARD
        ========================= */

        .dokumen-card {
            position: relative;

            display: flex;
            align-items: center;
            gap: 14px;

            padding: 17px;

            min-width: 0;

            background: rgba(255, 255, 255, 0.94);

            border: 1px solid
                rgba(15, 23, 42, 0.07);

            border-radius: 18px;

            box-shadow:
                0 8px 25px
                rgba(15, 23, 42, 0.055);

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                border-color 0.2s ease;
        }

        .dokumen-card:hover {
            transform: translateY(-2px);

            border-color:
                rgba(37, 99, 235, 0.18);

            box-shadow:
                0 14px 32px
                rgba(15, 23, 42, 0.09);
        }

        .dokumen-card:active {
            transform: scale(0.985);
        }

        /* =========================
           FILE ICON
        ========================= */

        .file-icon {
            flex: 0 0 auto;

            width: 52px;
            height: 58px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background: #f1f5f9;

            font-size: 27px;
        }

        .file-icon.pdf {
            background: #fff1f2;
        }

        .file-icon.image {
            background: #eff6ff;
        }

        .file-icon.word {
            background: #eff6ff;
        }

        .file-icon.excel {
            background: #f0fdf4;
        }

        .file-icon.powerpoint {
            background: #fff7ed;
        }

        .file-icon.zip {
            background: #faf5ff;
        }

        .file-icon.file {
            background: #f1f5f9;
        }

        /* =========================
           CARD CONTENT
        ========================= */

        .dokumen-info {
            min-width: 0;
            flex: 1;
        }

        .dokumen-title {
            margin: 0 0 6px;

            font-size: 15px;
            font-weight: 700;

            line-height: 1.4;

            color: #172033;

            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .dokumen-meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;

            gap: 7px;

            font-size: 12px;
            color: #94a3b8;
        }

        .format-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 4px 8px;

            border-radius: 7px;

            background: #f1f5f9;

            color: #64748b;

            font-size: 10px;
            font-weight: 800;

            letter-spacing: 0.4px;
        }

        .format-badge.pdf {
            background: #fee2e2;
            color: #b91c1c;
        }

        .format-badge.image {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .format-badge.word {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .format-badge.excel {
            background: #dcfce7;
            color: #15803d;
        }

        .format-badge.powerpoint {
            background: #ffedd5;
            color: #c2410c;
        }

        .format-badge.zip {
            background: #f3e8ff;
            color: #7e22ce;
        }

        /* =========================
           OPEN ARROW
        ========================= */

        .open-arrow {
            flex: 0 0 auto;

            width: 34px;
            height: 34px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background: #f8fafc;

            color: #64748b;

            font-size: 18px;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .dokumen-card:hover .open-arrow {
            background: #eff6ff;
            color: #2563eb;
            transform: translateX(2px);
        }

        /* =========================
           EMPTY / LOADING
        ========================= */

        .state-message {
            grid-column: 1 / -1;

            padding: 50px 20px;

            text-align: center;

            color: #64748b;
        }

        .state-icon {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .state-message h3 {
            margin: 0 0 7px;

            font-size: 17px;
            color: #334155;
        }

        .state-message p {
            margin: 0;

            font-size: 13px;
            line-height: 1.6;
        }

        /* =========================
           MODAL
        ========================= */

        .modal {
            position: fixed;
            inset: 0;

            z-index: 100;

            display: none;
            align-items: center;
            justify-content: center;

            padding: 14px;

            background:
                rgba(15, 23, 42, 0.62);

            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 850px;

            max-height: 94vh;

            display: flex;
            flex-direction: column;

            overflow: hidden;

            background: #ffffff;

            border-radius: 20px;

            box-shadow:
                0 25px 70px
                rgba(0, 0, 0, 0.25);
        }

        /* =========================
           MODAL HEADER
        ========================= */

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 12px;

            padding: 16px 18px;

            border-bottom: 1px solid #e2e8f0;
        }

        .modal-heading {
            min-width: 0;
        }

        .modal-heading h2 {
            margin: 0 0 4px;

            font-size: 17px;
            line-height: 1.35;

            color: #172033;

            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .modal-heading p {
            margin: 0;

            font-size: 12px;

            color: #94a3b8;

            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .btn-close {
            flex: 0 0 auto;

            width: 38px;
            height: 38px;

            border: 0;
            border-radius: 11px;

            background: #f1f5f9;
            color: #475569;

            cursor: pointer;

            font-size: 20px;
            line-height: 1;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .btn-close:hover {
            background: #e2e8f0;
        }

        .btn-close:active {
            transform: scale(0.94);
        }

        /* =========================
           MODAL CONTENT
        ========================= */

        .modal-content {
            position: relative;

            flex: 1;

            min-height: 220px;

            overflow: auto;

            background: #f8fafc;
        }

        .modal-content iframe {
            display: block;

            width: 100%;
            height: 65vh;

            min-height: 350px;

            border: 0;

            background: #ffffff;
        }

        .modal-content img {
            display: block;

            width: 100%;
            max-height: 65vh;

            object-fit: contain;

            padding: 15px;

            background: #ffffff;
        }

        .file-open-box {
            min-height: 280px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 35px 20px;

            text-align: center;
        }

        .file-open-icon {
            font-size: 58px;
            margin-bottom: 15px;
        }

        .file-open-box h3 {
            margin: 0 0 8px;

            font-size: 18px;
            color: #334155;
        }

        .file-open-box p {
            max-width: 500px;

            margin: 0 0 20px;

            font-size: 13px;
            line-height: 1.6;

            color: #64748b;
        }

        .btn-open-file {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 44px;

            padding: 0 18px;

            border-radius: 12px;

            background: #2563eb;
            color: #ffffff;

            text-decoration: none;

            font-size: 14px;
            font-weight: 700;

            box-shadow:
                0 7px 18px
                rgba(37, 99, 235, 0.22);

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .btn-open-file:hover {
            background: #1d4ed8;
        }

        .btn-open-file:active {
            transform: scale(0.97);
        }

        /* =========================
           MODAL FOOTER
        ========================= */

        .modal-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;

            gap: 10px;

            padding: 13px 16px;

            border-top: 1px solid #e2e8f0;

            background: #ffffff;
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 42px;

            padding: 0 16px;

            border-radius: 11px;

            background: #172033;
            color: #ffffff;

            text-decoration: none;

            font-size: 13px;
            font-weight: 700;

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .btn-download:hover {
            background: #0f172a;
        }

        .btn-download:active {
            transform: scale(0.97);
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            main {
                padding:
                    0 14px 30px;
            }

            .topbar {
                min-height: 58px;
                padding: 8px 12px;
            }

            .btn-back {
                width: 40px;
                height: 40px;

                border-radius: 11px;
            }

            .hero {
                padding:
                    28px 3px 22px;
            }

            .hero h1 {
                font-size: 30px;
                letter-spacing: -0.8px;
            }

            .hero p {
                font-size: 14px;
                line-height: 1.65;
            }

            #daftarPengumuman {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .dokumen-card {
                padding: 14px;

                border-radius: 16px;

                gap: 12px;
            }

            .file-icon {
                width: 48px;
                height: 53px;

                border-radius: 13px;

                font-size: 24px;
            }

            .dokumen-title {
                font-size: 14px;
            }

            .open-arrow {
                width: 31px;
                height: 31px;

                font-size: 16px;
            }

            .modal {
                padding: 0;
            }

            .modal-box {
                width: 100%;
                height: 100%;
                max-height: 100vh;

                border-radius: 0;
            }

            .modal-header {
                padding:
                    13px 14px;
            }

            .modal-heading h2 {
                font-size: 15px;
            }

            .modal-content iframe {
                height: calc(100vh - 150px);
                min-height: 300px;
            }

            .modal-content img {
                max-height:
                    calc(100vh - 150px);
            }

            .modal-footer {
                padding:
                    10px 12px;

                justify-content: stretch;
            }

            .btn-download {
                width: 100%;
            }
        }

        /* =========================
           SMALL PHONE
        ========================= */

        @media (max-width: 380px) {

            .hero h1 {
                font-size: 27px;
            }

            .hero p {
                font-size: 13px;
            }

            .file-icon {
                width: 44px;
                height: 50px;
            }

            .dokumen-card {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         TOP BAR
    ========================= -->

    <header class="topbar">
        <a
            href="index.html"
            class="btn-back"
            aria-label="Kembali"
        >
            ←
        </a>
    </header>


    <!-- =========================
         MAIN
    ========================= -->

    <main>

        <section class="hero">
            <h1>
                Informasi &amp; Dokumen
            </h1>

            <p>
                Akses informasi dan dokumen kegiatan jemaat dengan mudah.
            </p>
        </section>


        <!-- =========================
             DAFTAR DOKUMEN
        ========================= -->

        <section
            id="daftarPengumuman"
            aria-live="polite"
        >
            <div class="state-message">
                <div class="state-icon">📄</div>

                <h3>
                    Memuat dokumen...
                </h3>

                <p>
                    Mohon tunggu sebentar.
                </p>
            </div>
        </section>

    </main>


    <!-- =========================
         MODAL
    ========================= -->

    <div
        id="modal"
        class="modal"
        aria-hidden="true"
    >

        <div
            class="modal-box"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modalJudul"
        >

            <div class="modal-header">

                <div class="modal-heading">

                    <h2 id="modalJudul">
                        Dokumen
                    </h2>

                    <p id="modalNamaFile">
                        -
                    </p>

                </div>

                <button
                    type="button"
                    id="btnTutup"
                    class="btn-close"
                    aria-label="Tutup"
                >
                    ×
                </button>

            </div>


            <div
                id="modalContent"
                class="modal-content"
            >
            </div>


            <div class="modal-footer">

                <a
                    id="btnDownload"
                    class="btn-download"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                    download
                >
                    Download
                </a>

            </div>

        </div>

    </div>


    <!-- =========================
         SUPABASE
    ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-client.js"></script>

    <script src="pengumuman.js"></script>

</body>
</html>
