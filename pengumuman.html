<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Informasi Jemaat</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f4f6f8;

            color: #334155;
        }


        /* =====================================
           BAGIAN ATAS
        ===================================== */

        .top-area {

            width: 100%;

            max-width: 1000px;

            margin: auto;

            padding:
                12px
                12px
                5px;
        }


        /* =====================================
           TOMBOL KEMBALI
        ===================================== */

        .btn-kembali {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding:
                9px
                15px;

            background: #ffffff;

            color: #1f4e79;

            text-decoration: none;

            border: 1px solid #dfe6ec;

            border-radius: 10px;

            font-size: 14px;

            font-weight: 600;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.06);

            transition:
                all 0.2s ease;
        }


        .btn-kembali:hover {

            background: #1f4e79;

            color: #ffffff;

            border-color: #1f4e79;

            transform:
                translateY(-1px);
        }


        /* =====================================
           HEADER
        ===================================== */

        .page-header {

            max-width: 1000px;

            margin:
                8px auto
                20px;

            padding:
                8px 15px
                0;

            text-align: center;
        }


        .page-header h1 {

            margin: 0;

            color: #1f4e79;

            font-size: 25px;

            line-height: 1.35;

            font-weight: 700;
        }


        .header-line {

            width: 55px;

            height: 3px;

            margin:
                10px auto
                0;

            background: #1f4e79;

            border-radius: 10px;
        }


        /* =====================================
           CONTAINER
        ===================================== */

        .container {

            width: 100%;

            max-width: 1000px;

            margin: auto;

            padding:
                0 12px
                35px;
        }


        /* =====================================
           PENCARIAN
        ===================================== */

        .pencarian-box {

            margin-bottom: 18px;

            background: #ffffff;

            border: 1px solid #e2e8f0;

            border-radius: 12px;

            padding: 10px 12px;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.05);
        }


        .pencarian-wrapper {

            display: flex;

            align-items: center;

            gap: 10px;
        }


        .pencarian-icon {

            flex:
                0 0 auto;

            width: 20px;

            height: 20px;

            color: #1f4e79;
        }


        .pencarian-input {

            width: 100%;

            border: none;

            outline: none;

            background: transparent;

            color: #334155;

            font-family: inherit;

            font-size: 14px;
        }


        .pencarian-input::placeholder {

            color: #94a3b8;
        }


        .btn-hapus-pencarian {

            display: none;

            flex:
                0 0 auto;

            align-items: center;

            justify-content: center;

            width: 26px;

            height: 26px;

            border: none;

            border-radius: 50%;

            background: #edf2f7;

            color: #64748b;

            font-size: 18px;

            line-height: 1;

            cursor: pointer;
        }


        .btn-hapus-pencarian:hover {

            background: #e2e8f0;

            color: #334155;
        }


        /* =====================================
           HASIL PENCARIAN
        ===================================== */

        .info-hasil {

            margin:
                0 2px
                14px;

            color: #64748b;

            font-size: 12px;
        }


        /* =====================================
           DAFTAR PENGUMUMAN
        ===================================== */

        .daftar-pengumuman {

            display: grid;

            grid-template-columns:
                1fr;

            gap: 12px;
        }


        /* =====================================
           KARTU PENGUMUMAN
        ===================================== */

        .dokumen-card {

            display: flex;

            align-items: center;

            gap: 14px;

            width: 100%;

            padding:
                15px;

            background: #ffffff;

            border:
                1px solid
                #e2e8f0;

            border-radius: 12px;

            box-shadow:
                0 2px 9px
                rgba(0, 0, 0, 0.06);

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                border-color 0.2s ease;
        }


        .dokumen-card:hover {

            transform:
                translateY(-2px);

            border-color: #c7d7e5;

            box-shadow:
                0 6px 16px
                rgba(0, 0, 0, 0.09);
        }


        /* =====================================
           ICON
        ===================================== */

        .file-icon {

            flex:
                0 0 auto;

            width: 44px;

            height: 44px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 10px;

            background: #edf4fa;

            color: #1f4e79;
        }


        .file-icon svg {

            width: 23px;

            height: 23px;
        }


        /* =====================================
           ISI KARTU
        ===================================== */

        .dokumen-info {

            min-width: 0;

            flex: 1;
        }


        .dokumen-title {

            margin: 0;

            padding:
                0 4px;

            color: #334155;

            font-size: 14px;

            line-height: 1.45;

            font-weight: 700;

            word-break: break-word;
        }


        .dokumen-meta {

            margin-top: 5px;

            padding:
                0 4px;

            color: #94a3b8;

            font-size: 11px;

            line-height: 1.4;
        }


        .dokumen-deskripsi {

            margin-top: 6px;

            padding:
                0 4px;

            color: #64748b;

            font-size: 12px;

            line-height: 1.55;

            display:
                -webkit-box;

            -webkit-line-clamp: 2;

            -webkit-box-orient: vertical;

            overflow: hidden;
        }


        .format-badge {

            display: inline-flex;

            align-items: center;

            margin-left: 5px;

            padding:
                2px 6px;

            border-radius: 5px;

            background: #f1f5f9;

            color: #64748b;

            font-size: 9px;

            font-weight: 700;

            text-transform: uppercase;
        }


        /* =====================================
           PANAH
        ===================================== */

        .open-arrow {

            flex:
                0 0 auto;

            color: #94a3b8;

            font-size: 22px;

            line-height: 1;
        }


        /* =====================================
           KEADAAN KOSONG
        ===================================== */

        .kosong {

            text-align: center;

            background: #ffffff;

            border:
                1px solid
                #e2e8f0;

            border-radius: 12px;

            padding:
                45px 20px;

            color: #64748b;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.05);
        }


        .kosong strong {

            display: block;

            margin-bottom: 6px;

            color: #475569;

            font-size: 14px;
        }


        .kosong p {

            margin: 0;

            font-size: 12px;

            line-height: 1.6;
        }


        /* =====================================
           MODAL
        ===================================== */

        .modal {

            display: none;

            position: fixed;

            z-index: 9999;

            inset: 0;

            padding:
                20px;

            background:
                rgba(15, 23, 42, 0.72);

            align-items: center;

            justify-content: center;
        }


        .modal-box {

            width: 100%;

            max-width: 700px;

            max-height: 90vh;

            overflow: hidden;

            background: #ffffff;

            border-radius: 14px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.22);
        }


        /* =====================================
           HEADER MODAL
        ===================================== */

        .modal-header {

            display: flex;

            align-items: flex-start;

            justify-content: space-between;

            gap: 20px;

            padding:
                20px 32px;

            border-bottom:
                1px solid
                #e2e8f0;
        }


        .modal-header-text {

            min-width: 0;
        }


        .modal-header h2 {

            margin: 0;

            color: #1f4e79;

            font-size: 18px;

            line-height: 1.45;

            word-break: break-word;
        }


        .modal-nama-file {

            margin-top: 5px;

            color: #94a3b8;

            font-size: 11px;
        }


        .btn-tutup {

            flex:
                0 0 auto;

            width: 32px;

            height: 32px;

            display: flex;

            align-items: center;

            justify-content: center;

            border: none;

            border-radius: 8px;

            background: #f1f5f9;

            color: #64748b;

            font-size: 22px;

            line-height: 1;

            cursor: pointer;
        }


        .btn-tutup:hover {

            background: #e2e8f0;

            color: #334155;
        }


        /* =====================================
           ISI MODAL
        ===================================== */

        .modal-content {

            max-height:
                calc(90vh - 140px);

            overflow-y: auto;

            margin: 0 !important;

            padding: 0 !important;

            text-align: left !important;
        }


        .modal-content,
        .modal-content * {

            text-align: left !important;
        }


       .modal-keterangan {
    display: none;

    width: 100%;
    box-sizing: border-box;

    margin: 0;

    padding: 24px 36px 28px 36px;

    background: #ffffff;

    color: #334155;

    font-size: 14px;
    line-height: 1.8;

    text-align: left !important;
    text-indent: 0 !important;

    white-space: pre-wrap;

    word-break: break-word;
    overflow-wrap: anywhere;

    border-bottom: 1px solid #e2e8f0;
}

.modal-keterangan.active {
    display: block;
}


        .modal-keterangan,
        .modal-keterangan div,
        .modal-keterangan p,
        .modal-keterangan span {

            margin: 0;

            padding: 0;

            text-align: left !important;

            text-indent: 0 !important;
        }


        .modal-image {

            display: block;

            width: auto;

            max-width: 100%;

            max-height: 65vh;

            margin:
                20px auto;

            object-fit: contain;
        }


        .modal-file {

            padding:
                35px 32px;

            text-align: center;
        }


        .modal-file p {

            margin: 0 0 18px;

            color: #64748b;

            font-size: 14px;
        }


        /* =====================================
           FOOTER MODAL
        ===================================== */

        .modal-footer {

            display: flex;

            justify-content: flex-end;

            padding:
                14px 32px;

            border-top:
                1px solid
                #e2e8f0;
        }


        .btn-download {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-width: 100px;

            padding:
                9px 15px;

            border-radius: 8px;

            background: #1f4e79;

            color: #ffffff;

            text-decoration: none;

            font-size: 13px;

            font-weight: 600;
        }


        .btn-download:hover {

            background: #173b5d;
        }


        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 600px) {

            .top-area {

                padding:
                    10px
                    10px
                    4px;
            }


            .page-header {

                margin:
                    7px auto
                    18px;

                padding:
                    5px 12px
                    0;
            }


            .page-header h1 {

                font-size: 21px;
            }


            .container {

                padding:
                    0 10px
                    25px;
            }


            .pencarian-box {

                padding:
                    9px 11px;
            }


            .dokumen-card {

                gap: 11px;

                padding:
                    13px;
            }


            .file-icon {

                width: 40px;

                height: 40px;
            }


            .file-icon svg {

                width: 21px;

                height: 21px;
            }


            .dokumen-title {

                font-size: 13px;
            }


            .dokumen-meta {

                font-size: 10px;
            }


            .dokumen-deskripsi {

                font-size: 11px;
            }


            .modal {

                padding:
                    10px;
            }


            .modal-box {

                max-height: 92vh;

                border-radius: 12px;
            }


            .modal-header {

                padding:
                    16px
                    20px;
            }


            .modal-header h2 {

                font-size: 16px;
            }


            .modal-content {

                max-height:
                    calc(92vh - 120px);
            }


           .modal-keterangan {
    padding: 22px 26px 24px 26px;
    font-size: 14px;
    line-height: 1.8;
}


            .modal-footer {

                padding:
                    12px
                    20px;
            }

        }


        /* =====================================
           HP KECIL
        ===================================== */

        @media (max-width: 380px) {

            .btn-kembali {

                padding:
                    8px
                    12px;

                font-size: 13px;
            }


            .page-header h1 {

                font-size: 19px;
            }


            .dokumen-card {

                padding:
                    11px;
            }


            .file-icon {

                width: 38px;

                height: 38px;

                border-radius: 9px;
            }


            .dokumen-title {

                font-size: 12px;
            }


            .dokumen-deskripsi {

                font-size: 10px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================
         TOMBOL KEMBALI
    ===================================== -->

    <div class="top-area">

        <a
            href="index.html"
            class="btn-kembali"
        >
            ← Kembali
        </a>

    </div>


    <!-- =====================================
         JUDUL
    ===================================== -->

    <header class="page-header">

        <h1>
            Informasi Jemaat
        </h1>

        <div class="header-line"></div>

    </header>


    <!-- =====================================
         KONTEN
    ===================================== -->

    <main class="container">


        <!-- =================================
             PENCARIAN
        ================================= -->

        <div class="pencarian-box">

            <div class="pencarian-wrapper">

                <svg
                    class="pencarian-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <circle
                        cx="11"
                        cy="11"
                        r="7"
                    ></circle>

                    <path
                        d="M20 20l-3.5-3.5"
                    ></path>
                </svg>


                <input
                    type="search"
                    id="inputPencarian"
                    class="pencarian-input"
                    placeholder="Cari pengumuman..."
                    autocomplete="off"
                >


                <button
                    type="button"
                    id="btnHapusPencarian"
                    class="btn-hapus-pencarian"
                    aria-label="Hapus pencarian"
                >
                    ×
                </button>

            </div>

        </div>


        <!-- =================================
             JUMLAH HASIL
        ================================= -->

        <div
            id="infoHasil"
            class="info-hasil"
        >
        </div>


        <!-- =================================
             DAFTAR
        ================================= -->

        <div
            id="daftarPengumuman"
            class="daftar-pengumuman"
        >

            <div class="loading">
                Memuat informasi...
            </div>

        </div>


    </main>


    <!-- =====================================
         MODAL
    ===================================== -->

    <div
        id="modal"
        class="modal"
        aria-hidden="true"
    >

        <div
            class="modal-box"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modalJudul"
        >


            <div class="modal-header">

                <div class="modal-header-text">

                    <h2 id="modalJudul">
                    </h2>

                    <div
                        id="modalNamaFile"
                        class="modal-nama-file"
                    >
                    </div>

                </div>


                <button
                    type="button"
                    id="btnTutup"
                    class="btn-tutup"
                    aria-label="Tutup"
                >
                    ×
                </button>

            </div>


            <div
                id="modalContent"
                class="modal-content"
            >
            </div>


            <div class="modal-footer">

                <a
                    id="btnDownload"
                    class="btn-download"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                    download
                >
                    Download
                </a>

            </div>


        </div>

    </div>


    <!-- =====================================
         SUPABASE
    ===================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>


    <script src="supabase-client.js"></script>


    <script src="pengumuman.js?v=7"></script>


</body>

</html>
