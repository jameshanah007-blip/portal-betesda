<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Informasi Jemaat</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f4f7fa;
            color: #1e293b;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        /* =========================
           HEADER
        ========================= */

        .top-header {
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            width: min(1100px, 92%);
            margin: 0 auto;
            min-height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            text-decoration: none;
            color: #173f67;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        .btn-kembali {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            padding: 9px 14px;

            border: 1px solid #d7e1ea;
            border-radius: 8px;

            background: #ffffff;
            color: #245d8f;

            text-decoration: none;
            font-size: 13px;
            font-weight: 700;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease;
        }

        .btn-kembali:hover {
            background: #f4f8fb;
            border-color: #b8ccdc;
            transform: translateY(-1px);
        }


        /* =========================
           HALAMAN
        ========================= */

        .page {
            width: min(1100px, 92%);
            margin: 0 auto;
            padding: 42px 0 60px;
        }

        .page-header {
            margin-bottom: 24px;
        }

        .page-header span {
            display: block;
            margin-bottom: 7px;

            color: #6b7f91;

            font-size: 12px;
            font-weight: 700;

            letter-spacing: 1.1px;
            text-transform: uppercase;
        }

        .page-header h1 {
            margin: 0;

            color: #173f67;

            font-size: 30px;
            line-height: 1.2;
            font-weight: 700;
        }

        .page-header p {
            margin: 9px 0 0;

            color: #64748b;

            font-size: 14px;
            line-height: 1.6;
        }


        /* =========================
           PENCARIAN
        ========================= */

        .pencarian-box {
            margin-bottom: 22px;
        }

        .pencarian-wrapper {
            position: relative;
            width: 100%;
        }

        .pencarian-icon {
            position: absolute;

            left: 15px;
            top: 50%;

            width: 18px;
            height: 18px;

            transform: translateY(-50%);

            color: #7a8da0;

            pointer-events: none;
        }

        .pencarian-input {
            width: 100%;

            height: 46px;

            padding:
                0 46px
                0 44px;

            border: 1px solid #d8e2eb;
            border-radius: 9px;

            outline: none;

            background: #ffffff;
            color: #1e293b;

            font-family: inherit;
            font-size: 14px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .pencarian-input::placeholder {
            color: #94a3b8;
        }

        .pencarian-input:focus {
            border-color: #6f9abd;

            box-shadow:
                0 0 0 3px
                rgba(36, 93, 143, 0.08);
        }

        .btn-hapus-pencarian {
            position: absolute;

            right: 10px;
            top: 50%;

            width: 28px;
            height: 28px;

            transform: translateY(-50%);

            display: none;
            align-items: center;
            justify-content: center;

            border: none;
            border-radius: 50%;

            background: #edf2f7;
            color: #64748b;

            font-size: 18px;
            line-height: 1;

            cursor: pointer;
        }

        .btn-hapus-pencarian:hover {
            background: #e2e8f0;
            color: #334155;
        }

        .info-hasil {
            margin:
                0 0
                16px;

            color: #64748b;

            font-size: 13px;
        }


        /* =========================
           DAFTAR PENGUMUMAN
        ========================= */

        #daftarPengumuman {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 16px;
        }

        .dokumen-card {
            display: flex;
            align-items: center;

            min-width: 0;

            padding: 17px 18px;

            border: 1px solid #e1e8ef;
            border-radius: 10px;

            background: #ffffff;

            cursor: pointer;

            box-shadow:
                0 3px 12px
                rgba(23, 63, 103, 0.04);

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                transform 0.2s ease;
        }

        .dokumen-card:hover {
            border-color: #b9ccdc;

            box-shadow:
                0 7px 18px
                rgba(23, 63, 103, 0.08);

            transform: translateY(-2px);
        }

        .file-icon {
            flex: 0 0 auto;

            width: 42px;
            height: 42px;

            margin-right: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 9px;

            background: #edf4fa;
            color: #245d8f;
        }

        .file-icon svg {
            width: 21px;
            height: 21px;
        }

        .dokumen-info {
            min-width: 0;
            flex: 1;
        }

        .dokumen-title {
            margin: 0;

            color: #1e3a56;

            font-size: 14px;
            line-height: 1.5;
            font-weight: 700;

            word-break: break-word;
        }

        .dokumen-meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 7px;

            margin-top: 5px;

            color: #7a8da0;

            font-size: 11px;
            line-height: 1.4;
        }

        .format-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 3px 7px;

            border-radius: 5px;

            background: #f1f5f9;
            color: #64748b;

            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .open-arrow {
            flex: 0 0 auto;

            margin-left: 12px;

            color: #8aa0b2;

            font-size: 19px;
            line-height: 1;

            transition:
                color 0.2s ease,
                transform 0.2s ease;
        }

        .dokumen-card:hover .open-arrow {
            color: #245d8f;
            transform: translateX(2px);
        }


        /* =========================
           KEADAAN KOSONG
        ========================= */

        .kosong {
            grid-column: 1 / -1;

            padding: 45px 20px;

            border: 1px solid #e1e8ef;
            border-radius: 10px;

            background: #ffffff;

            text-align: center;
        }

        .kosong p {
            margin: 0;

            color: #64748b;

            font-size: 14px;
        }


        /* =========================
           MODAL
        ========================= */

        .modal {
            position: fixed;

            inset: 0;

            z-index: 1000;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                rgba(15, 23, 42, 0.72);
        }

        .modal-box {
            position: relative;

            width: min(720px, 94vw);

            max-height: 90vh;

            display: flex;
            flex-direction: column;

            overflow: hidden;

            border-radius: 12px;

            background: #ffffff;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.25);
        }


        /* =========================
           MODAL HEADER
        ========================= */

        .modal-header {
            flex-shrink: 0;

            display: flex;
            align-items: flex-start;
            justify-content: space-between;

            gap: 18px;

            padding: 20px 32px;

            border-bottom: 1px solid #e2e8f0;

            background: #ffffff;
        }

        .modal-header-text {
            min-width: 0;
        }

        .modal-header h2 {
            margin: 0;

            color: #173f67;

            font-size: 18px;
            line-height: 1.4;
            font-weight: 700;

            word-break: break-word;
        }

        .modal-header small {
            display: block;

            margin-top: 5px;

            color: #7a8da0;

            font-size: 11px;
        }

        .btn-tutup {
            flex: 0 0 auto;

            width: 32px;
            height: 32px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: none;
            border-radius: 7px;

            background: #f1f5f9;
            color: #64748b;

            font-size: 22px;
            line-height: 1;

            cursor: pointer;

            transition:
                background 0.2s ease,
                color 0.2s ease;
        }

        .btn-tutup:hover {
            background: #e2e8f0;
            color: #334155;
        }


        /* =========================
           MODAL CONTENT
        ========================= */

        .modal-content {
            flex: 0 1 auto;

            width: 100%;

            max-height:
                calc(90vh - 150px);

            overflow-y: auto;

            margin: 0;
            padding: 0;

            text-align: left;

            background: #ffffff;
        }

        /*
            PENTING:
            Jangan menambahkan padding: 0 pada
            .modal-keterangan di selector lain.
        */

        .modal-keterangan {
            display: block;

            width: 100%;

            margin: 0;

            padding:
                20px
                32px
                24px
                32px;

            box-sizing: border-box;

            background: #ffffff;

            color: #334155;

            font-size: 14px;

            line-height: 1.7;

            text-align: left;

            text-indent: 0;

            white-space: pre-wrap;

            word-break: break-word;

            overflow-wrap: anywhere;
        }


        /* =========================
           GAMBAR DALAM MODAL
        ========================= */

        .modal-gambar {
            display: block;

            width: 100%;

            max-width: 100%;

            max-height:
                calc(90vh - 150px);

            object-fit: contain;

            background: #f8fafc;
        }


        /* =========================
           FILE LAIN
        ========================= */

        .modal-file {
            padding:
                30px 32px;

            text-align: center;
        }

        .modal-file-icon {
            width: 56px;
            height: 56px;

            margin: 0 auto 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background: #edf4fa;
            color: #245d8f;
        }

        .modal-file-icon svg {
            width: 27px;
            height: 27px;
        }

        .modal-file p {
            margin: 0;

            color: #475569;

            font-size: 14px;
            line-height: 1.6;
        }


        /* =========================
           MODAL FOOTER
        ========================= */

        .modal-footer {
            flex-shrink: 0;

            display: flex;
            justify-content: flex-end;

            padding: 14px 32px;

            border-top: 1px solid #e2e8f0;

            background: #ffffff;
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 38px;

            padding: 0 15px;

            border-radius: 7px;

            background: #245d8f;
            color: #ffffff;

            text-decoration: none;

            font-size: 13px;
            font-weight: 700;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .btn-download:hover {
            background: #173f67;
            transform: translateY(-1px);
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 800px) {

            #daftarPengumuman {
                grid-template-columns: 1fr;
            }

            .page {
                padding-top: 32px;
            }

        }


        @media (max-width: 600px) {

            .header-container {
                min-height: 62px;
            }

            .brand {
                font-size: 15px;
            }

            .btn-kembali {
                padding:
                    8px
                    11px;

                font-size: 12px;
            }

            .page {
                width: 92%;
                padding:
                    28px
                    0
                    45px;
            }

            .page-header h1 {
                font-size: 25px;
            }

            .page-header p {
                font-size: 13px;
            }

            .dokumen-card {
                padding:
                    15px;
            }

            .file-icon {
                width: 40px;
                height: 40px;

                margin-right: 12px;
            }

            .dokumen-title {
                font-size: 13px;
            }

            .modal {
                padding: 10px;
            }

            .modal-box {
                width: 100%;
                max-height: 92vh;

                border-radius: 10px;
            }

            .modal-header {
                padding:
                    17px
                    20px;
            }

            .modal-header h2 {
                font-size: 16px;
            }

            .modal-content {
                max-height:
                    calc(92vh - 130px);
            }

            .modal-keterangan {
                padding:
                    18px
                    24px
                    22px
                    24px;

                font-size: 14px;
                line-height: 1.7;
            }

            .modal-file {
                padding:
                    25px
                    24px;
            }

            .modal-footer {
                padding:
                    12px
                    20px;
            }

        }


        @media (max-width: 380px) {

            .header-container {
                gap: 10px;
            }

            .brand {
                font-size: 14px;
            }

            .page-header h1 {
                font-size: 23px;
            }

            .modal-keterangan {
                padding:
                    17px
                    20px
                    21px
                    20px;
            }

        }

    </style>

</head>

<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header class="top-header">

        <div class="header-container">

            <a
                href="index.html"
                class="brand">

                GPIL Jemaat Betesda Purwosari

            </a>

            <a
                href="index.html"
                class="btn-kembali">

                ← Kembali

            </a>

        </div>

    </header>


    <!-- =========================
         HALAMAN
    ========================= -->

    <main class="page">

        <div class="page-header">

            <span>
                Portal Jemaat
            </span>

            <h1>
                Informasi Jemaat
            </h1>

            <p>
                Informasi dan pengumuman terbaru
                dari jemaat.
            </p>

        </div>


        <!-- =========================
             PENCARIAN
        ========================= -->

        <div class="pencarian-box">

            <div class="pencarian-wrapper">

                <svg
                    class="pencarian-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true">

                    <circle
                        cx="11"
                        cy="11"
                        r="7">
                    </circle>

                    <line
                        x1="16.65"
                        y1="16.65"
                        x2="21"
                        y2="21">
                    </line>

                </svg>


                <input
                    type="search"
                    id="inputPencarian"
                    class="pencarian-input"
                    placeholder="Cari pengumuman..."
                    autocomplete="off">


                <button
                    type="button"
                    id="btnHapusPencarian"
                    class="btn-hapus-pencarian"
                    aria-label="Hapus pencarian">

                    ×

                </button>

            </div>

        </div>


        <div
            id="infoHasil"
            class="info-hasil">
        </div>


        <!-- =========================
             DAFTAR
        ========================= -->

        <div id="daftarPengumuman">

            <div class="kosong">

                <p>
                    Memuat informasi...
                </p>

            </div>

        </div>

    </main>


    <!-- =========================
         MODAL
    ========================= -->

    <div
        id="modal"
        class="modal"
        aria-hidden="true">

        <div
            class="modal-box"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modalJudul"
            onclick="event.stopPropagation()">


            <div class="modal-header">

                <div class="modal-header-text">

                    <h2 id="modalJudul">
                        Pengumuman
                    </h2>

                    <small id="modalNamaFile">
                    </small>

                </div>


                <button
                    type="button"
                    id="btnTutup"
                    class="btn-tutup"
                    aria-label="Tutup">

                    ×

                </button>

            </div>


            <div
                id="modalContent"
                class="modal-content">
            </div>


            <div class="modal-footer">

                <a
                    id="btnDownload"
                    class="btn-download"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                    download>

                    Download

                </a>

            </div>

        </div>

    </div>


    <!-- =========================
         SUPABASE
    ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-client.js"></script>

    <script src="pengumuman.js?v=9"></script>


</body>
</html>
